<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copper Corn Station: Fisika</title>
<style>
  /* Halaman detail Copper Corn Station (konsep docs/cooper-station/detail/konsep-halaman-detail.md).
     Satu file, tanpa library, jalan dari file://. Semua simulasi dihitung langsung dari R 1.000 m dan g 9,81 m/s^2
     (sama dengan CONFIG di index.html). Label di kanvas English saja; teks halaman ID + EN (kamus S). */
  :root { --ink: #e8ecf2; --muted: #9aa2ae; --line: rgba(255,255,255,0.10); --glass: rgba(14,18,27,0.72);
    --cu: #d9bd62; --cu2: #f4dc8a; --te: #8fd3dc; --or: #f3a55a; --red: #ff8a7a; --bar: 58px; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--bar) + 12px); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  html, body { margin: 0; color: var(--ink); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
  body { background: radial-gradient(circle 90vmax at 80% 0%, #1b1710 0%, #090b10 42%, #050608 100%) fixed #050608; }
  a { color: var(--cu2); }
  b, strong { color: #fff; font-weight: 650; }
  kbd { display: inline-block; min-width: 1.9em; padding: 1px 7px; border-radius: 6px; text-align: center; font: 600 12.5px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: #fff; background: linear-gradient(#2b3240, #1a1f29); border: 1px solid rgba(255,255,255,0.18); border-bottom-width: 3px; }
  code { font: 13.5px ui-monospace, Menlo, Consolas, monospace; color: var(--cu2); background: rgba(217,189,98,0.08); padding: 1px 6px; border-radius: 5px; }

  /* ===== bilah atas ===== */
  .bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); z-index: 50; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: rgba(6,8,12,0.78); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1px solid var(--line); }
  .bar .back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; font-size: 13px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; }
  .bar .back:hover { border-color: var(--cu); }
  .bar .brand { font-weight: 700; letter-spacing: 0.04em; font-size: 14px; white-space: nowrap; }
  .bar .brand span { color: var(--cu); }
  .bar nav { flex: 1; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 12px), transparent); padding: 0 8px; }
  .bar nav::-webkit-scrollbar { display: none; }
  .bar nav a { flex: none; color: var(--muted); text-decoration: none; font-size: 12.5px; padding: 6px 10px; border-radius: 99px; transition: all .25s; white-space: nowrap; }
  .bar nav a b { color: inherit; opacity: 0.6; margin-right: 5px; font-weight: 600; }
  .bar nav a:hover { color: #fff; }
  .bar nav a.on { color: #0b0b0b; background: var(--cu); }
  .bar .lang { display: flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .bar .lang button { font: 600 12px system-ui, sans-serif; color: var(--muted); background: none; border: 0; padding: 6px 10px; cursor: pointer; }
  .bar .lang button.on { color: #0b0b0b; background: var(--cu); }
  .play { display: inline-flex; align-items: center; gap: 8px; background: var(--cu); color: #0b0b0b; font-weight: 700; text-decoration: none; border-radius: 99px; padding: 8px 16px; font-size: 13.5px; white-space: nowrap;
    box-shadow: 0 6px 26px rgba(217,189,98,0.25); transition: transform .2s, box-shadow .2s; }
  .play:hover { transform: translateY(-1px); box-shadow: 0 8px 34px rgba(217,189,98,0.45); }
  .play svg { width: 13px; height: 13px; }
  .prog { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: linear-gradient(90deg, var(--or), var(--cu), var(--te)); box-shadow: 0 0 10px var(--cu); }
  @media (max-width: 760px) { .bar .brand, .bar .back span { display: none; } .bar .play span { display: none; } .bar .play { padding: 8px 11px; } }

  /* ===== umum ===== */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }
  @media (max-width: 600px) { .wrap { padding: 0 16px; } }
  .kick { color: var(--cu); font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 600; }
  .rv { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0s); }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 13px/1.4 system-ui, sans-serif; color: var(--ink); text-decoration: none; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); border-radius: 99px; padding: 7px 14px; cursor: pointer; transition: all .2s; }
  a.btn, a.play, a.back, .chip, .stamp, .bar nav a { text-decoration: none; }
  .btn:hover { border-color: var(--cu); color: #fff; }
  .btn.on { background: var(--cu); border-color: var(--cu); color: #0b0b0b; }
  .btn.main { background: var(--cu); border-color: var(--cu); color: #0b0b0b; }
  .btn.main:hover { box-shadow: 0 0 22px rgba(217,189,98,0.4); }
  .btn:disabled { opacity: 0.45; cursor: default; }

  /* ===== hero ===== */
  .hero { min-height: 100vh; padding: calc(var(--bar) + 40px) 0 50px; display: flex; align-items: center; position: relative; }
  .hero .wrap { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; width: 100%; }
  .hero h1 { margin: 10px 0 0; font-size: clamp(40px, 7vw, 86px); line-height: 0.98; letter-spacing: -0.02em; font-weight: 750;
    background: linear-gradient(100deg, #fff 10%, #f7e3a6 45%, #f3a55a 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .lead { color: #c3cad4; font-size: clamp(16px, 1.6vw, 19px); max-width: 56ch; margin: 18px 0 26px; }
  .hero .cta { display: flex; gap: 10px; flex-wrap: wrap; }
  .orb { position: relative; aspect-ratio: 1; width: 100%; max-width: 560px; justify-self: center; }
  .orb canvas { width: 100%; height: 100%; display: block; }
  .orb .tog { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); display: flex; gap: 6px; background: var(--glass); padding: 5px; border-radius: 99px; border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .orb .tog .btn { padding: 5px 12px; font-size: 12px; white-space: nowrap; }
  .orb .hcap { position: absolute; left: 0; right: 0; bottom: -64px; margin: 0; text-align: center; font-size: 13.5px; color: #c3cad4; min-height: 42px; }
  .orb .turn { position: absolute; top: 4px; right: 0; font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .orb .turn b { color: var(--cu); font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 34px; }
  .stat { background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015)); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; color: var(--cu); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat b small { font-size: 12px; color: var(--ink); font-weight: 500; margin-left: 3px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .orb { margin-bottom: 64px; }
  @media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; } .orb { max-width: 440px; } .stats { grid-template-columns: repeat(2, 1fr); } }
  .scrollhint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); color: var(--muted); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; }

  /* ===== bab ===== */
  section.ch { padding: 90px 0 40px; position: relative; }
  section.ch::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(217,189,98,0.25), transparent); }
  .chh { display: grid; grid-template-columns: auto 1fr; gap: 0 24px; align-items: end; margin-bottom: 28px; }
  .chh .n { font-size: 76px; line-height: 0.85; font-weight: 200; color: var(--cu); opacity: 0.55; font-variant-numeric: tabular-nums; }
  .chh h2 { margin: 4px 0 0; font-size: clamp(28px, 4vw, 46px); line-height: 1.08; letter-spacing: -0.01em; }
  .chh .hook { grid-column: 1 / -1; margin: 12px 0 0; font-size: clamp(17px, 1.8vw, 21px); font-weight: 300; color: #fff; max-width: 60ch; }
  .cols { display: grid; grid-template-columns: 5fr 7fr; gap: 36px; align-items: start; }
  .cols.flip { grid-template-columns: 7fr 5fr; }
  .cols.flip > .txt { order: 2; }
  .cols.even { grid-template-columns: 1fr 1fr; }
  @media (max-width: 960px) { .cols, .cols.flip, .cols.even { grid-template-columns: 1fr; } .cols.flip > .txt { order: 0; } }
  #cvLift { aspect-ratio: 16 / 8; background: #0a0d14; }
  @media (max-width: 600px) { #cvLift { aspect-ratio: 1 / 1; } }
  .txt p { margin: 0 0 14px; color: #c3cad4; }
  .txt p b { color: #fff; }
  .formula { margin: 18px 0; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(217,189,98,0.25); background: rgba(217,189,98,0.05); }
  .formula .f { font: 600 16px ui-monospace, Menlo, Consolas, monospace; color: var(--cu2); }
  .formula .w { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .tryit { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: rgba(143,211,220,0.06); border: 1px solid rgba(143,211,220,0.22); font-size: 14px; color: #cfe9ec; }
  .tryit::before { content: ''; flex: none; width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: var(--te); box-shadow: 0 0 0 4px rgba(143,211,220,0.18), 0 0 12px var(--te); }
  .fact { display: flex; gap: 10px; margin: 10px 0; font-size: 14.5px; color: #c3cad4; }
  .fact i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--cu); margin-top: 9px; box-shadow: 0 0 8px var(--cu); }

  /* ===== lab (panel simulasi) ===== */
  .lab { background: linear-gradient(180deg, rgba(20,26,38,0.9), rgba(10,13,20,0.92)); border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05); }
  .lab .stage { position: relative; }
  .lab canvas { display: block; width: 100%; }
  .lab .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255,255,255,0.07); }
  .lab .split canvas { background: #0a0d14; aspect-ratio: 1 / 1; }
  @media (max-width: 600px) { .lab .split { grid-template-columns: 1fr; } .lab .split canvas { aspect-ratio: 4 / 3; } }
  .ctrl { padding: 14px 16px 6px; display: grid; gap: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row .lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; margin-right: 4px; }
  .chip { font: 600 12.5px system-ui, sans-serif; color: var(--ink); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); border-radius: 99px; padding: 5px 12px; cursor: pointer; transition: all .2s; }
  .chip:hover { border-color: var(--cu); }
  .chip.on { background: rgba(217,189,98,0.18); border-color: var(--cu); color: #fff; }
  .slide { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; font-size: 13.5px; }
  .slide span { color: var(--muted); white-space: nowrap; }
  .slide output { font-variant-numeric: tabular-nums; color: #fff; font-weight: 650; min-width: 86px; text-align: right; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--cu) var(--p, 50%), rgba(255,255,255,0.14) var(--p, 50%)); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.14); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--cu); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; border: 3px solid var(--cu); box-shadow: 0 0 12px rgba(217,189,98,0.6); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--cu); box-shadow: 0 0 12px rgba(217,189,98,0.6); }
  input[type=number] { width: 70px; font: inherit; color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 3px 8px; }
  .ro { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: rgba(255,255,255,0.07); border-top: 1px solid rgba(255,255,255,0.07); }
  .ro div { background: #0c1018; padding: 11px 14px; }
  .ro b { display: block; font-size: 21px; font-variant-numeric: tabular-nums; line-height: 1.25; color: var(--cu); }
  .ro b.t { color: var(--te); } .ro b.o { color: var(--or); } .ro b.w { color: #fff; } .ro b.r { color: var(--red); }
  .ro span { font-size: 12px; color: var(--muted); }
  .verdict { margin: 0 16px 14px; padding: 10px 14px; border-radius: 10px; font-size: 14px; background: rgba(255,255,255,0.04); border-left: 3px solid var(--cu); color: #d6dbe2; min-height: 22px; }
  .verdict:empty { display: none; }

  /* ===== paspor ===== */
  .pass { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .stamp { position: relative; text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 16px 16px 14px; border-radius: 16px; border: 1px dashed rgba(255,255,255,0.18);
    background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01)); transition: all .3s; }
  .stamp:hover { border-color: var(--cu); transform: translateY(-2px); }
  .stamp h4 { margin: 0 46px 6px 0; font-size: 16px; }
  .stamp p { margin: 0 0 10px; font-size: 13.5px; color: #b9c1cb; }
  .stamp .k { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
  .stamp .k a { color: var(--cu2); text-decoration: none; border-bottom: 1px dashed rgba(244,220,138,0.4); }
  .stamp .seal { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.22); display: grid; place-items: center; transition: all .35s cubic-bezier(.3,1.6,.5,1); }
  .stamp .seal svg { width: 20px; height: 20px; opacity: 0; transition: opacity .2s; }
  .stamp.done { border-style: solid; border-color: rgba(217,189,98,0.55); background: linear-gradient(180deg, rgba(217,189,98,0.12), rgba(217,189,98,0.02)); }
  .stamp.done .seal { border: 2px solid var(--cu); background: var(--cu); transform: rotate(-12deg) scale(1.08); box-shadow: 0 0 18px rgba(217,189,98,0.5); }
  .stamp.done .seal svg { opacity: 1; }
  .passhead { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .passhead .meter { flex: 1; min-width: 200px; max-width: 360px; }
  .passhead .meter div { height: 6px; border-radius: 6px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 6px; }
  .passhead .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--or), var(--cu)); transition: width .5s; }
  .passhead .meter span { font-size: 13px; color: var(--muted); }

  /* ===== di balik layar ===== */
  details.trick { border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.025); margin-bottom: 10px; overflow: hidden; }
  details.trick summary { cursor: pointer; list-style: none; padding: 14px 16px; display: flex; gap: 12px; align-items: center; font-weight: 650; }
  details.trick summary::-webkit-details-marker { display: none; }
  details.trick summary::after { content: '+'; margin-left: auto; color: var(--cu); font-size: 20px; font-weight: 300; transition: transform .25s; }
  details.trick[open] summary::after { transform: rotate(45deg); }
  details.trick summary em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 500; }
  details.trick .body { padding: 0 16px 14px; color: #c3cad4; font-size: 14.5px; }
  details.trick .body p { margin: 0 0 8px; }
  .fig { margin: 22px 0 0; }
  .fig img { width: 100%; height: auto; display: block; border-radius: 14px; border: 1px solid var(--line); }
  .fig figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }

  /* ===== galeri ===== */
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .gal button { padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: none; cursor: zoom-in; transition: transform .25s, border-color .25s; text-align: left; color: inherit; font: inherit; }
  .gal button:hover { transform: translateY(-3px); border-color: var(--cu); }
  .gal img { width: 100%; height: auto; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
  .gal span { display: block; padding: 8px 12px; font-size: 13px; color: #c3cad4; background: rgba(255,255,255,0.03); }
  .lb { position: fixed; inset: 0; z-index: 80; background: rgba(3,4,7,0.92); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 70px 16px 40px; }
  .lb.on { display: flex; }
  .lb img { max-width: min(1200px, 100%); max-height: 100%; border-radius: 14px; box-shadow: 0 30px 90px rgba(0,0,0,0.6); }
  .lb .x, .lb .pv, .lb .nx { position: absolute; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 99px; width: 44px; height: 44px; font-size: 20px; cursor: pointer; }
  .lb .x { top: 16px; right: 16px; } .lb .pv { left: 12px; top: 50%; } .lb .nx { right: 12px; top: 50%; }
  .lb .cap { position: absolute; top: 22px; left: 20px; right: 80px; color: var(--muted); font-size: 14px; }
  .lb .cap a { margin-left: 10px; }

  footer { padding: 70px 0 60px; color: var(--muted); font-size: 13px; text-align: center; }
  footer .end { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
</style>
</head>
<body>

<header class="bar">
  <a class="back" id="backLink" href="../../index.html"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg><span data-t="menu"></span></a>
  <div class="brand">Copper Corn <span>Station</span></div>
  <nav id="nav"></nav>
  <div class="lang" id="lang"></div>
  <a class="play" id="playTop" href="index.html"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg><span data-t="play"></span></a>
  <div class="prog" id="prog"></div>
</header>

<!-- ================= HERO ================= -->
<section class="hero" id="top">
  <div class="wrap">
    <div>
      <div class="kick rv" data-t="h_kick"></div>
      <h1 class="rv" style="--d:.08s" data-t="h_title"></h1>
      <p class="lead rv" style="--d:.16s" data-t="h_lead"></p>
      <div class="cta rv" style="--d:.24s"><a class="btn main" href="#stasiun" data-t="h_go"></a><a class="btn" id="playHero" href="index.html" data-t="play"></a></div>
      <div class="stats rv" style="--d:.32s" id="stats"></div>
    </div>
    <div class="orb rv" style="--d:.2s">
      <canvas id="cvHero" role="img" aria-label="Copper Corn Station cross-section"></canvas>
      <div class="turn" id="heroTurn"></div>
      <div class="tog"><button class="btn on" data-hv="out" type="button" data-t="h_out"></button><button class="btn" data-hv="in" type="button" data-t="h_in"></button></div>
      <p class="hcap" id="heroCap"></p>
    </div>
  </div>
  <div class="scrollhint" data-t="scroll"></div>
</section>

<!-- ================= 01 STASIUN ================= -->
<section class="ch" id="stasiun">
  <div class="wrap">
    <div class="chh rv"><div class="n">01</div><div><div class="kick" data-t="c1_k"></div><h2 data-t="c1_t"></h2></div><p class="hook" data-t="c1_h"></p></div>
    <div class="cols">
      <div class="txt rv"><p data-t="c1_p1"></p><p data-t="c1_p2"></p>
        <div class="fact"><i></i><span data-t="c1_f1"></span></div><div class="fact"><i></i><span data-t="c1_f2"></span></div><div class="fact"><i></i><span data-t="c1_f3"></span></div>
      </div>
      <figure class="fig rv" style="--d:.1s;margin:0"><img src="detail/cc-01-station.svg" width="960" height="540" alt="Copper Corn Station cross-section and side view" loading="lazy"><figcaption data-t="c1_cap"></figcaption></figure>
    </div>
  </div>
</section>

<!-- ================= 02 GRAVITASI ================= -->
<section class="ch" id="gravitasi">

const OB = { t: 4, play: false };
const HALF = Math.asin(SAT_R / ORB_R);
const phiOf = (t) => -2.3 + (TAU * t) / P_ORB;   // stasiun mulai di sisi terang
const inEcl = (t) => { const p = phiOf(t); return Math.cos(p) > 0 && Math.abs(Math.sin(p)) * ORB_R < SAT_R; };
const orb = panel('cvOrb', (o) => {
  const c = o.ctx, w = o.w, h = o.h; c.clearRect(0, 0, w, h); bgStars(c, w, h, 21, 110);
  const cx = w * 0.52, cy = h * 0.52, ro = Math.min(w * 0.36, h * 0.4), k = ro / ORB_R, rs = SAT_R * k, ecl = inEcl(OB.t);
  const sun = c.createRadialGradient(-w * 0.06, cy, 0, -w * 0.06, cy, h * 0.5); sun.addColorStop(0, 'rgba(255,248,224,1)'); sun.addColorStop(0.25, 'rgba(255,210,122,0.85)'); sun.addColorStop(1, 'rgba(243,165,90,0)');
  c.fillStyle = sun; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 5; i++) { const y = cy - h * 0.3 + i * h * 0.15; arrow(c, w * 0.05, y, w * 0.13, y, 'rgba(243,165,90,0.7)', 1.5); }
  const um = c.createLinearGradient(cx, 0, w, 0); um.addColorStop(0, 'rgba(0,0,0,0.85)'); um.addColorStop(1, 'rgba(0,0,0,0.12)'); c.fillStyle = um; c.fillRect(cx, cy - rs, w - cx, rs * 2);
  c.strokeStyle = 'rgba(255,255,255,0.4)'; c.setLineDash([3, 6]); c.lineWidth = 1; c.beginPath(); c.arc(cx, cy, ro, 0, TAU); c.stroke(); c.setLineDash([]);
  glow(c, COL.or, 10); c.strokeStyle = COL.or; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.arc(cx, cy, ro, -HALF, HALF); c.stroke(); noGlow(c);
  // Saturnus
  const ringP = (half) => { c.save(); c.translate(cx, cy); c.rotate(-0.24); c.strokeStyle = 'rgba(230,211,168,0.85)'; c.lineWidth = Math.max(2, rs * 0.16); c.beginPath(); c.ellipse(0, 0, rs * 2.2, rs * 0.42, 0, half ? Math.PI : 0, half ? TAU : Math.PI); c.stroke(); c.restore(); };
  ringP(true);
  const sb = c.createLinearGradient(cx, cy - rs, cx, cy + rs); ['#d9c08e', '#c8a873', '#e6d3a8', '#b8925e', '#e2c895', '#c49f69', '#b08a58'].forEach((col, i, a) => sb.addColorStop(i / (a.length - 1), col));
  c.fillStyle = sb; c.beginPath(); c.arc(cx, cy, rs, 0, TAU); c.fill();
  const nt = c.createLinearGradient(cx - rs, 0, cx + rs, 0); nt.addColorStop(0.35, 'rgba(0,0,0,0)'); nt.addColorStop(1, 'rgba(0,0,0,0.85)'); c.fillStyle = nt; c.beginPath(); c.arc(cx, cy, rs, 0, TAU); c.fill();
  if (ecl) { c.strokeStyle = 'rgba(255,190,120,0.9)'; glow(c, COL.or, 18); c.lineWidth = 1.5; c.beginPath(); c.arc(cx, cy, rs + 1.5, 0, TAU); c.stroke(); noGlow(c); }
  ringP(false);
  // stasiun
  const p = phiOf(OB.t), sx = cx + Math.cos(p) * ro, sy = cy + Math.sin(p) * ro;
  c.save(); c.translate(sx, sy); c.rotate(p + Math.PI / 2 - 0.44); glow(c, ecl ? '#555' : COL.cu, ecl ? 0 : 14); c.fillStyle = ecl ? '#6b6250' : COL.cu; c.fillRect(-12, -4, 24, 8); noGlow(c); c.restore();
  pillC(c, sx + (Math.cos(p) > 0 ? -16 : 16), sy - 22, ecl ? 'ECLIPSE · sunline off' : 'Copper Corn Station', ecl ? COL.or : COL.cu, 11.5, Math.cos(p) > 0 ? 'right' : 'left');
  txt(c, cx, cy + rs + 26, 'Saturn', COL.ink, 12, 'center', 600);
  corner(c, 'TOP VIEW OF THE ORBIT PLANE · TO SCALE');
  // garis waktu
  const tx0 = 16, tx1 = w - 16, ty = h - 14; c.fillStyle = 'rgba(217,189,98,0.25)'; c.fillRect(tx0, ty - 3, tx1 - tx0, 6);
  for (let i = 0; i <= 200; i++) { const tt = (P_ORB * i) / 200; if (inEcl(tt)) { c.fillStyle = COL.or; c.fillRect(tx0 + ((tx1 - tx0) * i) / 200, ty - 5, (tx1 - tx0) / 200 + 1, 10); } }
  c.fillStyle = '#fff'; c.fillRect(tx0 + ((tx1 - tx0) * OB.t) / P_ORB - 1, ty - 8, 2, 16);
}, (dt) => { if (!OB.play) return false; OB.t = (OB.t + dt * P_ORB / 22) % P_ORB; updOrb(false); return true; });
function eclWindow() {   // waktu masuk dan keluar bayangan
  const p0 = -HALF, p1 = HALF, base = -2.3;
  const t0 = ((((p0 - base) % TAU) + TAU) % TAU) / TAU * P_ORB, t1 = ((((p1 - base) % TAU) + TAU) % TAU) / TAU * P_ORB;
  return [t0, t1];
}
function updOrb(draw = true) {
  const [t0, t1] = eclWindow(), e = inEcl(OB.t); $('oT').value = OB.t; setP($('oT'));
  const hh = (x) => { const H = Math.floor(x), M = Math.round((x - H) * 60); return `${H} ${LANG === 'en' ? 'h' : 'jam'} ${String(M).padStart(2, '0')} m`; };
  $('oTo').textContent = hh(OB.t);
  $('oState').textContent = T(e ? 'o_ecl' : 'o_sun'); $('oState').className = e ? 'o' : '';
  $('oSun').textContent = e ? '0 %' : '100 %';
  const nxt = e ? (t1 - OB.t + P_ORB) % P_ORB : (t0 - OB.t + P_ORB) % P_ORB;
  $('oNext').textContent = hh(nxt); $('oNextL').textContent = T(e ? 'o_left' : 'o_next');
  if (draw) orb.draw(orb);
}
$('oT').addEventListener('input', (e) => { OB.t = +e.target.value; updOrb(); });
$('oPlay').addEventListener('click', () => { OB.play = !OB.play; $('oPlay').textContent = T(OB.play ? 'c7_pause' : 'c7_play'); });
$('oJump').addEventListener('click', () => { OB.t = (eclWindow()[0] - 2 / 60 + P_ORB) % P_ORB; updOrb(); });

/* =====================================================================
   Paspor fisika (localStorage per penonton; aman bila diblokir)
   ===================================================================== */
let STAMP = [];
try { STAMP = JSON.parse(localStorage.getItem('cooperStation.passport') || '[]'); if (!Array.isArray(STAMP)) STAMP = []; } catch (e) { STAMP = []; }
const saveStamp = () => { try { localStorage.setItem('cooperStation.passport', JSON.stringify(STAMP)); } catch (e) { /* abaikan */ } };
function renderPass() {
  const box = $('pass'); box.textContent = '';
  PASS.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'stamp' + (STAMP.includes(i) ? ' done' : '');
    b.innerHTML = `<div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div><h4></h4><p></p><div class="k">${p[2][L()]} · <a href="#${p[3]}"></a></div>`;
    b.querySelector('h4').textContent = p[0][L()]; b.querySelector('p').textContent = p[1][L()];
    const a = b.querySelector('a'); a.textContent = S.nav[L()][CH_IDS.indexOf(p[3])]; a.addEventListener('click', (e) => e.stopPropagation());
    b.addEventListener('click', () => { const j = STAMP.indexOf(i); j < 0 ? STAMP.push(i) : STAMP.splice(j, 1); saveStamp(); renderPass(); });
    box.appendChild(b);
  });
  const n = STAMP.length; $('passCount').textContent = n === PASS.length ? T('c8_all') : T('c8_count', { n, m: PASS.length }); $('passBar').style.width = (n / PASS.length) * 100 + '%';
}
$('passReset').addEventListener('click', () => { STAMP = []; saveStamp(); renderPass(); });

/* =====================================================================
   Galeri + lightbox
   ===================================================================== */
let LB = 0;
function lbShow(i) { LB = (i + GAL.length) % GAL.length; const g = GAL[LB]; $('lbImg').src = 'detail/' + g[0]; $('lbImg').alt = g[1][1]; $('lbCap').innerHTML = `${LB + 1} / ${GAL.length} · ${g[1][L()]} <a href="detail/${g[0]}" target="_blank" rel="noopener">${T('gl_open')}</a>`; $('lb').classList.add('on'); }
const lbHide = () => $('lb').classList.remove('on');
$('lbX').addEventListener('click', lbHide); $('lbP').addEventListener('click', () => lbShow(LB - 1)); $('lbN').addEventListener('click', () => lbShow(LB + 1));
$('lb').addEventListener('click', (e) => { if (e.target === $('lb')) lbHide(); });
addEventListener('keydown', (e) => { if (!$('lb').classList.contains('on')) return; if (e.key === 'Escape') lbHide(); if (e.key === 'ArrowRight') lbShow(LB + 1); if (e.key === 'ArrowLeft') lbShow(LB - 1); });

/* =====================================================================
   Render teks (ulang saat ganti bahasa)
   ===================================================================== */
function setP(inp) { const p = ((+inp.value - +inp.min) / (+inp.max - +inp.min)) * 100; inp.style.setProperty('--p', p + '%'); }
function render() {
  document.documentElement.lang = LANG; document.title = LANG === 'en' ? 'Copper Corn Station: Physics' : 'Copper Corn Station: Fisika';
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = T(el.dataset.t); });
  const q = '?lang=' + LANG;
  ['backLink', 'backEnd'].forEach((id) => { $(id).href = '../../index.html' + q; });
  ['playTop', 'playHero', 'playEnd'].forEach((id) => { $(id).href = 'index.html' + q; });
  // nav
  const nav = $('nav'); nav.textContent = '';
  CH_IDS.forEach((id, i) => { const a = document.createElement('a'); a.href = '#' + id; a.innerHTML = `<b>${id === 'galeri' ? '+' : '0' + (i + 1)}</b>`; a.append(S.nav[L()][i]); nav.appendChild(a); });
  // statistik
  const st = $('stats'); st.textContent = '';
  for (const [v, u, k, col] of [[fmt(1000), 'm', 'st_r'], [fmt(8000), 'm', 'st_l'], [fmt(63.4, 1), 's', 'st_t'], [fmt(99.05, 2), 'm/s', 'st_v', COL.te], [fmt(37.57, 2), 'h', 'st_o', COL.or]]) {
    const d = document.createElement('div'); d.className = 'stat'; d.innerHTML = `<b${col ? ` style="color:${col}"` : ''}>${v}<small>${u}</small></b><span>${T(k)}</span>`; st.appendChild(d);
  }
  // preset Coriolis
  const cp = $('cPre'); cp.textContent = '';
  CPRE.forEach((p, i) => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = S.c3_pre[L()][i]; b.addEventListener('click', () => { cSet(p[0], p[1]); cGo(); }); cp.appendChild(b); cp.append(' '); });
  // galeri
  const gl = $('gal'); gl.textContent = '';
  GAL.forEach((g, i) => { const b = document.createElement('button'); b.type = 'button'; b.innerHTML = `<img src="detail/${g[0]}" alt="" loading="lazy" width="960" height="540"><span></span>`; b.querySelector('span').textContent = `${i + 1}. ${g[1][L()]}`; b.querySelector('img').alt = g[1][1]; b.addEventListener('click', () => lbShow(i)); gl.appendChild(b); });
  $('lang').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.lang === LANG));
  $('oPlay').textContent = T(OB.play ? 'c7_pause' : 'c7_play');
  document.querySelectorAll('.massIn').forEach((m) => { m.value = MASS; });
  renderPass(); updGrav(); cRead(); updFount(); updRain(); updW(); updLift(); updOrb(); heroCap(); navSpy();
}
for (const [c, n] of [['id', 'ID'], ['en', 'EN']]) {
  const b = document.createElement('button'); b.type = 'button'; b.dataset.lang = c; b.textContent = n;
  b.addEventListener('click', () => { LANG = c; try { localStorage.setItem('lazarus.lang', c); } catch (e) { /* abaikan */ } history.replaceState(null, '', '?lang=' + c + location.hash); render(); });
  $('lang').appendChild(b);
}
document.querySelectorAll('.massIn').forEach((m) => m.addEventListener('input', () => { const v = +m.value; if (v >= 20 && v <= 200) { MASS = v; document.querySelectorAll('.massIn').forEach((x) => { if (x !== m) x.value = v; }); updGrav(); updW(); } }));

/* =====================================================================
   Gulir: muncul, navigasi aktif, progres
   ===================================================================== */
const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }, { threshold: 0.12 });
document.querySelectorAll('.rv').forEach((el) => io.observe(el));
let CUR = '';
const spy = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { CUR = e.target.id; navSpy(); } }, { rootMargin: '-45% 0px -50% 0px' });
CH_IDS.forEach((id) => spy.observe($(id)));
function navSpy() {
  $('nav').querySelectorAll('a').forEach((a) => { const on = a.getAttribute('href') === '#' + CUR; a.classList.toggle('on', on); if (on && a.scrollIntoView) { const n = $('nav'); n.scrollTo({ left: a.offsetLeft - n.clientWidth / 2 + a.clientWidth / 2, behavior: reduce ? 'auto' : 'smooth' }); } });
}
addEventListener('scroll', () => { const m = document.documentElement.scrollHeight - innerHeight; $('prog').style.width = (m > 0 ? (scrollY / m) * 100 : 0) + '%'; }, { passive: true });

// mulai
cSet(176.5, 0);
render();
requestAnimationFrame(loop);
window.__detail = { traj, liftV, liftState, LF, CS, inEcl, T: () => LANG };   // untuk uji
window.__detailReady = true;
</script>
</body>
