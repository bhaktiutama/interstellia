<script type="module">
/* =====================================================================
   Millar's World, versi realistis tahap R1 (rencana: docs/millar/rencana-realistis-millar.md).
   R1: preset kualitas, post HDR (bloom, ACES, grading, grain, FXAA), langit mendung prosedural di cubemap
   (juga dipakai pantulan air), laut Gerstner halus tanpa daratan, gelombang raksasa diberi shading realistis.
   Prototipe low poly lama: prototipe.html. Semua angka yang bisa diatur ada di CONFIG.
   ===================================================================== */
import * as THREE from 'three';

const CONFIG = {
  R: 8282e3,            // radius planet (m), asumsi massa jenis seperti Bumi: 1,3 x 6.371 km
  g: 12.75,             // 1,3 g (m/s^2)
  dil: 61362,           // 1 jam planet = 7 tahun di luar (7 x 365,25 x 24)
  eye: 1.7,             // tinggi mata di atas dasar laut (m)
  jumpV: 3.13,          // kecepatan lompat sama dengan lompatan 0,5 m di Bumi -> 0,385 m di sini (77%)
  sea: { bed: -0.6 },   // dasar laut rata-rata (m di bawah muka air); variasi +-0,18 m, lihat seabed()
  chop: {               // ombak angin sehari-hari di air setinggi lutut (bukan gelombang raksasa)
    Hs: 0.35,           // tinggi signifikan (m), parameter tampilan, bisa diatur
    dir: 25,            // arah angin (derajat dari +X)
    q: 0.72,            // ketajaman puncak Gerstner (jumlah Q k a; < 1 agar tidak melipat)
    depth: 0.6,         // kedalaman untuk dispersi air dangkal (m)
  },
  wave: {               // gelombang raksasa (konsep: sekitar 1.200 m)
    H: 1200,            // tinggi (m)
    v: 125,             // kecepatan muka (m/s), parameter desain
    start: 30000,       // jarak awal saat mulai (m)
    spawn: 150000,      // gelombang berikutnya muncul dari balik cakrawala (m)
    summon: 20000,      // tombol G
    wf: 350, wc: 600, wb: 5000,   // lebar muka curam, bahu puncak, punggung landai (m)
    lean: 0.33,         // condong puncak ke depan (x H)
    dd: 0.2,            // air surut di depan gelombang (m); dasar laut tetap terendam
    ddL: 6000,          // jangkauan air surut (m)
  },
  garg: { az: 28, el: 22, rad: 9, tilt: 9 },     // arah (derajat dari arah datang gelombang), radius bayangan, miring piringan
  wobble: { period: 40, amp0: 0.35, amp1: 1.4 },  // goyangan planet (s, derajat)
  cloud: { h0: 1500, h1: 3500, scale: 2600 },     // lapisan awan (m)
  fogD: 30000,          // kabut di atas laut (m, e-fold)
  exposure: 0.85,

/* ---------------- Preset kualitas (pola sama dengan Copper Corn Station) ----------------

  { name: 'Tinggi', dpr: 1.5,  msaa: 4, bloom: 6, grain: 1, cube: 384, faceEvery: 1, steps: 32, layers: 2, oct: 4, nw: 16, nm: 8,  cell: 0.45, near: 70 },
  { name: 'Sedang', dpr: 1.25, msaa: 0, bloom: 4, grain: 1, cube: 256, faceEvery: 1, steps: 0,  layers: 2, oct: 5, nw: 14, nm: 6,  cell: 0.6,  near: 72 },
  { name: 'Rendah', dpr: 1.0,  msaa: 0, bloom: 2, grain: 1, cube: 192, faceEvery: 2, steps: 0,  layers: 1, oct: 5, nw: 12, nm: 4,  cell: 0.8,  near: 72 },
  { name: 'Hemat',  dpr: 0.85, msaa: 0, bloom: 2, grain: 0, cube: 128, faceEvery: 2, steps: 0,  layers: 1, oct: 4, nw: 10, nm: 2,  cell: 1.0,  near: 70 },
];
const PRESET = { idx: 1, auto: true, low: 0 };
const MOODS = [
  { key: 'Otomatis' },          // mendung, sesekali awan terbuka di sekitar Gargantua
  { key: 'Mendung' },
  { key: 'Senja' },
];
const MOOD = { idx: 0, k: 0, brk: 0, cover: 0.93 };

/* ---------------- Bahasa (sama dengan halaman lain: lazarus.lang dan ?lang=) ---------------- */
const LANGS = [['id', 'Indonesia'], ['en', 'English']];
let LANG = 'id';
{
  const ok = (c) => LANGS.some((x) => x[0] === c); let c = null;
  try { c = new URLSearchParams(location.search).get('lang'); } catch (e) { /* abaikan */ }
  if (!ok(c)) try { c = localStorage.getItem('lazarus.lang'); } catch (e) { c = null; }

}
const KEYS_ID = '<b>Klik</b> kunci mouse &middot; <b>WASD</b> jalan &middot; <b>Shift</b> lari &middot; <b>Space</b> lompat<br><b>V</b> tampilan &middot; <b>G</b> panggil gelombang &middot; <b>Z</b> kecepatan waktu &middot; <b>P</b> grafik &middot; <b>N</b> suasana &middot; <b>R</b> kembali &middot; <b>H</b> sembunyikan';
const I18N = { en: {
  '< Menu': '< Menu', 'Kembali ke menu utama': 'Back to main menu', 'Mulai': 'Start',
  'Planet air di dekat Gargantua · 1,3 g · 1 jam = 7 tahun di luar': 'Water planet near Gargantua · 1.3 g · 1 hour = 7 years outside',
  'Kualitas grafik': 'Graphics quality', 'Turunkan otomatis bila FPS di bawah 30': 'Lower automatically when FPS drops below 30',

  'Suasana': 'Mood', 'Otomatis': 'Auto', 'Mendung': 'Overcast', 'Senja': 'Dusk',
  'Ultra': 'Ultra', 'Tinggi': 'High', 'Sedang': 'Medium', 'Rendah': 'Low', 'Hemat': 'Saver', ' (otomatis)': ' (auto)',
  'Waktu planet': 'Planet time', 'Waktu di luar': 'Time outside', 'Gravitasi': 'Gravity', 'Kedalaman air': 'Water depth',
  'Gelombang': 'Wave', 'Tiba dalam': 'Arrives in', 'sudah lewat': 'passed', 'di luar': 'outside', 'Goyangan planet': 'Planet wobble',
  'Tampilan': 'View', 'Kecepatan waktu': 'Time speed', 'Jalan kaki': 'On foot', 'Drone 60 m': 'Drone 60 m', 'Tinggi 1,5 km': 'High 1.5 km',
  'Grafik': 'Graphics', 'GPU (langit / scene / post)': 'GPU (sky / scene / post)',
  'tahun': 'y', 'hari': 'd', 'jam': 'h', 'mnt': 'min', 'dtk': 's',
  'Tersapu gelombang. Kembali ke titik awal.<br>Waktu yang hilang di luar: {y}': 'Swept by the wave. Back to the start point.<br>Time lost outside: {y}',
  'Gelombang dipanggil: {d} km': 'Wave summoned: {d} km',
  'Grafik: {p}': 'Graphics: {p}', 'Suasana: {m}': 'Mood: {m}', 'FPS rendah: grafik diturunkan ke {p}.': 'Low FPS: graphics lowered to {p}.',
  [KEYS_ID]: '<b>Click</b> lock mouse &middot; <b>WASD</b> walk &middot; <b>Shift</b> run &middot; <b>Space</b> jump<br><b>V</b> view &middot; <b>G</b> summon wave &middot; <b>Z</b> time speed &middot; <b>P</b> graphics &middot; <b>N</b> mood &middot; <b>R</b> reset &middot; <b>H</b> hide',
} };
function t(src, vars) {
  let s = LANG !== 'id' && I18N[LANG] && I18N[LANG][src] !== undefined ? I18N[LANG][src] : src;
  if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}
const fmtN = (x, d = 0) => x.toLocaleString(LANG === 'id' ? 'id-ID' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
function translateDom() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-html]').forEach((el) => { el.innerHTML = t(el.dataset.tHtml === 'keys' ? KEYS_ID : el.dataset.tHtml); });
  for (const id of ['back', 'menuLink']) document.getElementById(id).href = `../../index.html?lang=${LANG}`;
  document.querySelectorAll('#lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === LANG));
  document.querySelectorAll('#presetPick button').forEach((b, i) => { b.textContent = t(PRESETS[i].name); });
  document.querySelectorAll('#moodPick button').forEach((b, i) => { b.textContent = t(MOODS[i].key); });
}
for (const [c, name] of LANGS) {
  const b = document.createElement('button'); b.type = 'button'; b.dataset.lang = c; b.textContent = name;
  b.addEventListener('click', () => { LANG = c; try { localStorage.setItem('lazarus.lang', c); } catch (e) { /* abaikan */ } translateDom(); });
  document.getElementById('lang').appendChild(b);
}

/* ---------------- Renderer, kamera ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });  // skala 0,1 m sampai 300 km
renderer.autoClear = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // konversi sRGB dilakukan sendiri di pass akhir
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 700000);
camera.rotation.order = 'YXZ';
const col = (hex) => new THREE.Color(hex);    // hex sRGB -> linear

/* ---------------- Arah Gargantua dan uniform bersama ---------------- */
const G = CONFIG.garg;
const GDIR = new THREE.Vector3(Math.cos(G.el * DEG) * Math.cos(G.az * DEG), Math.sin(G.el * DEG), -Math.cos(G.el * DEG) * Math.sin(G.az * DEG)).normalize();
const GU = new THREE.Vector3().crossVectors(GDIR, new THREE.Vector3(0, 1, 0)).normalize(), GV = new THREE.Vector3().crossVectors(GU, GDIR);
const SUNL = new THREE.Vector3(GDIR.x, 0, GDIR.z).normalize().multiplyScalar(Math.cos(4 * DEG)).setY(Math.sin(4 * DEG));   // cahaya rendah suasana senja
const U = {   // uniform bersama material permukaan (objek uniform dipakai bersama lewat spread)
  uT: { value: 0 }, uR: { value: CONFIG.R }, uCam: { value: new THREE.Vector3() },
  uWX: { value: W.start }, uWH: { value: W.H }, uLean: { value: W.lean },
  uSky: { value: null }, uWob: { value: new THREE.Matrix3() }, uFogD: { value: CONFIG.fogD }, uPix: { value: 0.001 },
  uAmb: { value: new THREE.Color() }, uScat: { value: new THREE.Color(0.10, 0.135, 0.155) }, uAbs: { value: new THREE.Vector3(2.0, 1.6, 1.45) },
  uBed: { value: new THREE.Color(0.32, 0.29, 0.24) }, uFoamC: { value: new THREE.Color(0.95, 0.97, 0.98) },
  uWA: { value: Array.from({ length: 16 }, () => new THREE.Vector4()) }, uWB: { value: Array.from({ length: 16 }, () => new THREE.Vector4()) },
  uMA: { value: Array.from({ length: 12 }, () => new THREE.Vector4()) }, uMB: { value: Array.from({ length: 12 }, () => new THREE.Vector4()) },
};

/* ---------------- Ombak angin (Gerstner): data gelombang, dinormalisasi per preset ---------------- */
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const CHOP = { base: [], micro: [], nw: 0, nm: 0 };
{
  const r = rng(7), C = CONFIG.chop, wind = C.dir * DEG;
  const omega = (k) => Math.sqrt(CONFIG.g * k * Math.tanh(k * C.depth));    // dispersi air dangkal, g = 12,75
  for (let i = 0; i < 16; i++) {                       // terbesar dulu: preset rendah memakai yang pertama
    const L = 0.9 * Math.pow(6.5 / 0.9, 1 - i / 15) * (0.9 + 0.2 * r()), k = 2 * Math.PI / L;   // ombak pendek dan tajam (0,9-6,5 m)
    const th = wind + (r() - 0.5) * (0.6 + 1.2 * i / 15);
    CHOP.base.push({ dx: Math.cos(th), dz: Math.sin(th), k, w: omega(k), ph: r() * Math.PI * 2, a0: L * (0.7 + 0.6 * r()) });
  }
  for (let i = 0; i < 12; i++) {                       // riak halus hanya di normal piksel (0,2-1,0 m)
    const L = 0.2 + 0.8 * Math.pow(1 - i / 11, 1.3) * (0.85 + 0.3 * r()), k = 2 * Math.PI / L, th = wind + (r() - 0.5) * 2.4;
    CHOP.micro.push({ dx: Math.cos(th), dz: Math.sin(th), k, w: omega(k), ph: r() * Math.PI * 2, a: 0.08 / k });   // kemiringan k a = 0,08
  }
}
function applyChop(nw, nm) {
  const C = CONFIG.chop, B = CHOP.base.slice(0, nw);
  const s2 = B.reduce((s, b) => s + b.a0 * b.a0 / 2, 0), sc = (C.Hs / 4) / Math.sqrt(s2);    // Hs = 4 sigma
  B.forEach((b, i) => {
    b.a = b.a0 * sc; b.q = C.q / (b.k * b.a * nw);
    U.uWA.value[i].set(b.dx, b.dz, b.k, b.a); U.uWB.value[i].set(b.w, b.ph, b.q, 0);
  });
  CHOP.micro.slice(0, nm).forEach((m, i) => { U.uMA.value[i].set(m.dx, m.dz, m.k, m.a); U.uMB.value[i].set(m.w, m.ph, 0, 0); });
  CHOP.nw = nw; CHOP.nm = nm;
}
const chopAt = (x, z, t) => { let y = 0; for (let i = 0; i < CHOP.nw; i++) { const b = CHOP.base[i]; y += b.a * Math.sin(b.k * (b.dx * x + b.dz * z) - b.w * t + b.ph); } return y; };

/* ---------------- GLSL bersama: gelombang raksasa, dasar laut, lengkung, ombak ----------------
   Rumus di sini punya kembaran JS (frontX, waveHz, waveG, drawdown, seabed, chopAt): ubah keduanya bersama. */
const COMMON = /* glsl */`
uniform float uT, uR, uWX, uWH, uLean, uFogD, uPix;
uniform vec3 uCam, uAmb, uScat, uAbs, uBed, uFoamC;
uniform samplerCube uSky; uniform mat3 uWob;
uniform vec4 uWA[16], uWB[16], uMA[12], uMB[12];
float frontX(float z) { return uWX + 2500.0 * sin(z * 4.0e-5 + 1.3) + 900.0 * sin(z * 1.7e-4); }
float waveHz(float z) { return uWH * (0.82 + 0.18 * sin(z * 9.0e-5 + 0.4)); }
float waveG(float u) {
  if (u < 0.0) { float k = u / ${W.wf.toFixed(1)}; return exp(-k * k); }
  float k = u / ${W.wc.toFixed(1)}; return 0.35 * exp(-k * k) + 0.65 * exp(-u / ${W.wb.toFixed(1)});
}
float drawdown(float u) { float k = (u + ${W.ddL.toFixed(1)}) / ${W.ddL.toFixed(1)}; return -${W.dd.toFixed(2)} * exp(-k * k); }
float seabed(vec2 p) {
  return ${CONFIG.sea.bed.toFixed(2)} + 0.06 * sin(0.13 * p.x + 0.07 * p.y) + 0.05 * sin(-0.05 * p.x + 0.21 * p.y + 1.7)
    + 0.03 * sin(0.61 * p.x + 0.43 * p.y) + 0.04 * sin(0.011 * p.x + 0.4) * sin(0.013 * p.y + 1.1);

// Kabut semburan di atas puncak dan kaki gelombang: lembar tembus pandang, memudar ke atas dan ke samping
function sprayGeo(u0, u1, rows) {

  for (let j = 0; j < ZS.length - 1; j++) for (let r = 0; r < rows; r++) { const a = j * (rows + 1) + r, c = a + rows + 1; idx.push(a, c, a + 1, a + 1, c, c + 1); }

}

/* ---------------- Ukur GPU (pola GPUT Copper Corn Station) ---------------- */
const GPUT = { ext: null, pool: [], pend: [], cur: null, frame: 0, acc: {}, ms: { sk: 0, sc: 0, po: 0 }, n: 0 };

function gpuFrameEnd() {

  const gl = renderer.getContext(), bad = gl.getParameter(GPUT.ext.GPU_DISJOINT_EXT);

/* ---------------- Terapkan preset ---------------- */
function viewSize() {
  const P = PRESETS[PRESET.idx], pr = Math.min(window.devicePixelRatio || 1, P.dpr);
  return [Math.max(1, Math.round(innerWidth * pr)), Math.max(1, Math.round(innerHeight * pr))];
}
function resize() {
  const [w, h] = viewSize();

  camera.aspect = w / h; camera.updateProjectionMatrix();
  makePost(w, h, PRESETS[PRESET.idx]);
  U.uPix.value = 2 * Math.tan(camera.fov * DEG / 2) / h;     // sudut satu piksel (rad), untuk meredam ombak di bawah ukuran piksel
}
function applyPreset(i) {

  for (const m of [seaNear.material, seaFar.material, waveMat]) { m.defines.NW = P.nw; m.defines.NM = P.nm; m.needsUpdate = true; }
  skyMat.defines.STEPS = P.steps; skyMat.defines.LAYERS = P.layers; skyMat.defines.OCT = P.oct; skyMat.needsUpdate = true;
  buildSea(P);
  makeSkyCube(P.cube);

  try { localStorage.setItem('millar.preset', JSON.stringify({ idx: i, auto: PRESET.auto })); } catch (e) { /* abaikan */ }

  const au = document.getElementById('presetAuto'); if (au) au.checked = PRESET.auto;
}

  if (!PRESET.auto || !STATE.started) return;
  PRESET.low = fps < 30 ? PRESET.low + dt : Math.max(0, PRESET.low - dt);
  if (PRESET.low > 4 && PRESET.idx < PRESETS.length - 1) { applyPreset(PRESET.idx + 1); PRESET.low = -6; toast(t('FPS rendah: grafik diturunkan ke {p}.', { p: t(PRESETS[PRESET.idx].name) }), 3); }
}

/* ---------------- Suasana: warna langit dan cahaya, bergeser halus ---------------- */
const PAL = [
  { haze: [0.56, 0.60, 0.62], zen: [0.36, 0.42, 0.50], hi: [0.64, 0.66, 0.68], lo: [0.24, 0.26, 0.29], glow: [0.45, 0.40, 0.32], warm: [0, 0, 0], amb: [0.50, 0.53, 0.55] },
  { haze: [0.72, 0.52, 0.38], zen: [0.22, 0.22, 0.32], hi: [0.95, 0.62, 0.40], lo: [0.20, 0.16, 0.18], glow: [0.70, 0.46, 0.26], warm: [1.6, 0.8, 0.35], amb: [0.50, 0.40, 0.34] },
];
function updateMood(dt, simT) {
  const goK = MOOD.idx === 2 ? 1 : 0;
  const goCover = MOOD.idx === 1 ? 0.97 : MOOD.idx === 2 ? 0.8 : 0.93;
  // Otomatis: celah awan di sekitar Gargantua terbuka sekitar 70 s tiap 5 menit
  const goBrk = MOOD.idx === 1 ? 0 : MOOD.idx === 2 ? 0.85 :THREE.MathUtils.smoothstep(Math.sin(simT * 2 * Math.PI / 300 - 1.3), 0.45, 0.8);
  const k = 1 - Math.exp(-dt / 2.5);
  MOOD.k += (goK - MOOD.k) * k; MOOD.cover += (goCover - MOOD.cover) * k; MOOD.brk += (goBrk - MOOD.brk) * k;
  const L = (key) => PAL[0][key].map((v, i) => v + (PAL[1][key][i] - v) * MOOD.k);
  SKYU.uHaze.value.setRGB(...L('haze')); SKYU.uZen.value.setRGB(...L('zen')); SKYU.uCloudHi.value.setRGB(...L('hi')); SKYU.uCloudLo.value.setRGB(...L('lo'));
  SKYU.uGlow.value.setRGB(...L('glow')); SKYU.uWarm.value.setRGB(...L('warm')); U.uAmb.value.setRGB(...L('amb'));
  SKYU.uMood.value = MOOD.k; SKYU.uCover.value = MOOD.cover; SKYU.uBreak.value = MOOD.brk;
}
function setMood(i) {
  MOOD.idx = i;
  document.querySelectorAll('#moodPick button').forEach((b, k) => b.classList.toggle('on', k === i));
}

/* ---------------- Kembaran JS untuk fisika pemain dan HUD ---------------- */
const frontX = (z) => U.uWX.value + 2500 * Math.sin(z * 4e-5 + 1.3) + 900 * Math.sin(z * 1.7e-4);
const waveHz = (z) => U.uWH.value * (0.82 + 0.18 * Math.sin(z * 9e-5 + 0.4));
const waveG = (u) => u < 0 ? Math.exp(-((u / W.wf) ** 2)) : 0.35 * Math.exp(-((u / W.wc) ** 2)) + 0.65 * Math.exp(-u / W.wb);
const drawdown = (u) => -W.dd * Math.exp(-(((u + W.ddL) / W.ddL) ** 2));
const seabed = (x, z) => CONFIG.sea.bed + 0.06 * Math.sin(0.13 * x + 0.07 * z) + 0.05 * Math.sin(-0.05 * x + 0.21 * z + 1.7)
  + 0.03 * Math.sin(0.61 * x + 0.43 * z) + 0.04 * Math.sin(0.011 * x + 0.4) * Math.sin(0.013 * z + 1.1);
const waveTop = (x, z) => { const u = x - frontX(z); return waveHz(z) * waveG(u) + drawdown(u); };
const waterAt = (x, z, tt) => Math.max(drawdown(x - frontX(z)) + chopAt(x, z, tt), waveTop(x, z));

  if (e.code === 'KeyG') { U.uWX.value += P.x + W.summon - frontX(P.z); toast(t('Gelombang dipanggil: {d} km', { d: fmtN(W.summon / 1000) }), 2.5); }

  if (document.pointerLockElement === canvas) { dx = e.movementX; dy = e.movementY; }
  else if (drag) { dx = e.clientX - drag.x; dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY }; }
  P.yaw -= dx * 0.0022; P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch - dy * 0.0022));
});

function stepPlayer(dt) {
  const v = CONFIG.views[P.view];
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  let mx = 0, mz = 0;
  if (keys.KeyW) mx += fx, mz += fz;
  if (keys.KeyS) mx -= fx, mz -= fz;
  if (keys.KeyA) mx += fz, mz -= fx;
  if (keys.KeyD) mx -= fz, mz += fx;
  const len = Math.hypot(mx, mz);
  const bed = seabed(P.x, P.z), water = waterAt(P.x, P.z, STATE.visT), depth = Math.max(0, water - bed);
  if (len > 0) {
    let sp = (keys.ShiftLeft || keys.ShiftRight ? 4.2 : 1.5) * v.sp;
    if (P.view === 0) sp *= Math.max(0.35, 1 - 0.9 * depth);   // air setinggi lutut memperlambat langkah
    P.x += mx / len * sp * dt; P.z += mz / len * sp * dt;
  }
  if (P.view === 0) {
    const floor = seabed(P.x, P.z) + CONFIG.eye;
    P.y += P.vy * dt - 0.5 * CONFIG.g * dt * dt; P.vy -= CONFIG.g * dt;   // tepat untuk g tetap
    if (P.y <= floor) { P.y = floor; P.vy = 0; P.ground = true; }
  } else {
    P.y += (Math.max(0, water) + v.h - P.y) * Math.min(1, dt * 2);
  }
  return depth;
}
// Waktu simulasi: gelombang maju, jam berjalan, tersapu (dipisah agar bisa diuji dengan langkah tetap)
function simStep(sdt, dt) {
  STATE.simT += sdt; CLK.planet += sdt;
  U.uWX.value -= W.v * sdt;
  if (frontX(P.z) - P.x < -60000) U.uWX.value += (P.x + W.spawn) - frontX(P.z);
  const top = waveTop(P.x, P.z);
  if (top > P.y + 0.2) CLK.white = Math.min(1, CLK.white + dt * 1.5);
  else CLK.white = Math.max(0, CLK.white - dt * 0.8);
  if (CLK.white >= 1 && CLK.swept <= 0) {
    const lostPlanet = 50000 / W.v;                       // gelombang dianggap sudah lewat 50 km
    resetPlayer(); P.view = 0;
    U.uWX.value += P.x - 50000 - frontX(P.z);
    CLK.planet += lostPlanet; CLK.swept = 2.5;
    toast(t('Tersapu gelombang. Kembali ke titik awal.<br>Waktu yang hilang di luar: {y}', { y: fmtOutside(lostPlanet * CONFIG.dil) }), 6);
  }
  if (CLK.swept > 0) CLK.swept -= dt;
}

/* ---------------- HUD ---------------- */
const rowsEl = document.getElementById('rows');
function fmtClock(s) { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`; }
function fmtOutside(s) {
  const y = Math.floor(s / (365.25 * 86400)); s -= y * 365.25 * 86400;
  const d = Math.floor(s / 86400), h = Math.floor((s - d * 86400) / 3600);
  return `${fmtN(y)} ${t('tahun')} ${fmtN(d)} ${t('hari')} ${fmtN(h)} ${t('jam')}`;
}
function fmtDur(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m > 0 ? `${m} ${t('mnt')} ${s % 60} ${t('dtk')}` : `${s} ${t('dtk')}`; }
let hudT = 0, fps = 60;
function updateHud(depth, dist, wob) {
  const eta = dist / W.v, warn = dist > 0 && dist < 15000 ? 'warn' : '';
  const rows = [
    [t('Waktu planet'), fmtClock(CLK.planet), 'big'],
    [t('Waktu di luar'), fmtOutside(CLK.planet * CONFIG.dil), 'big'],
    [t('Gravitasi'), `${fmtN(CONFIG.g / 9.80665, 1)} g (${fmtN(CONFIG.g, 2)} m/s²)`],
    [t('Kedalaman air'), `${fmtN(depth, 2)} m`],
    [t('Gelombang'), dist > 0 ? `${fmtN(dist / 1000, 1)} km, ${fmtN(waveHz(P.z))} m` : t('sudah lewat'), warn],
    [t('Tiba dalam'), dist > 0 ? `${fmtDur(eta)} (${fmtN(eta * CONFIG.dil / (365.25 * 86400), 1)} ${t('tahun')} ${t('di luar')})` : '-', warn],
    [t('Goyangan planet'), `${fmtN(wob, 2)}°`],
    [t('Tampilan'), t(CONFIG.views[P.view].key)],
    [t('Kecepatan waktu'), `${CONFIG.speeds[P.speed]}x`],
    [t('Grafik'), t(PRESETS[PRESET.idx].name) + (PRESET.auto ? t(' (otomatis)') : '')],
    [t('Suasana'), t(MOODS[MOOD.idx].key)],
    ['FPS', fmtN(fps)],
  ];
  if (GPUT.ext && GPUT.n) rows.push([t('GPU (langit / scene / post)'), `${fmtN(GPUT.ms.sk, 1)} / ${fmtN(GPUT.ms.sc, 1)} / ${fmtN(GPUT.ms.po, 1)} ms`]);
  rowsEl.innerHTML = rows.map(([a, b, c]) => `<div>${a}</div><div class="${c || ''}">${b}</div>`).join('');
}

/* ---------------- Layar awal: pilihan grafik dan suasana ---------------- */
{
  const pick = document.getElementById('presetPick'), mp = document.getElementById('moodPick');
  PRESETS.forEach((Pr, i) => { const b = document.createElement('button'); b.type = 'button'; b.addEventListener('click', () => { applyPreset(i); }); pick.appendChild(b); });
  MOODS.forEach((m, i) => { const b = document.createElement('button'); b.type = 'button'; b.addEventListener('click', () => setMood(i)); mp.appendChild(b); });
  document.getElementById('presetAuto').addEventListener('change', (e) => { PRESET.auto = e.target.checked; applyPreset(PRESET.idx); });
  document.getElementById('go').addEventListener('click', start);
}
// Preset awal dari ?preset=ultra|tinggi|sedang|rendah|hemat, atau pilihan terakhir yang tersimpan
{
  let idx = 1;
  try {
    const q = new URLSearchParams(location.search).get('preset'), qi = q ? PRESETS.findIndex((Pr) => Pr.name.toLowerCase() === q.toLowerCase()) : -1;
    if (qi >= 0) { idx = qi; PRESET.auto = false; }
    else { const sv = JSON.parse(localStorage.getItem('millar.preset') || 'null'); if (sv && PRESETS[sv.idx]) { idx = sv.idx; PRESET.auto = sv.auto !== false; } }
  } catch (e) { idx = 1; }
  applyPreset(idx);
}
setMood(0); translateDom();
addEventListener('resize', resize);

/* ---------------- Loop ---------------- */
const WOB_AXIS = new THREE.Vector3(1, 0, 0.35).normalize(), wobQ = new THREE.Quaternion(), wobM4 = new THREE.Matrix4();
let last = performance.now(), depthNow = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  autoPreset(dt);
  const sdt = dt * CONFIG.speeds[P.speed];
  STATE.visT += sdt;
  if (STATE.started) { depthNow = stepPlayer(dt); simStep(sdt, dt); }
  const dist = frontX(P.z) - P.x;
  // Goyangan planet: langit bergoyang pelan, makin kuat saat gelombang mendekat
  const close = 1 - Math.min(1, Math.max(0, (dist - 10000) / 140000));
  const wob = (CONFIG.wobble.amp0 + CONFIG.wobble.amp1 * close * close) * Math.sin(STATE.visT * 2 * Math.PI / CONFIG.wobble.period);
  wobQ.setFromAxisAngle(WOB_AXIS, -wob * DEG);          // arah di tanah -> arah di langit (kebalikan putaran langit)
  U.uWob.value.setFromMatrix4(wobM4.makeRotationFromQuaternion(wobQ));
  updateMood(dt, STATE.visT);
  SKYU.uTime.value = STATE.visT;

  camera.position.set(P.x, P.y, P.z);
  camera.rotation.set(P.pitch, P.yaw, 0);
  camera.updateMatrixWorld();
  U.uT.value = STATE.visT; U.uCam.value.copy(camera.position);
  seaNear.material.uniforms.uOff.value.set(Math.round(P.x / SEA.cell) * SEA.cell, 0, Math.round(P.z / SEA.cell) * SEA.cell);
  seaFar.material.uniforms.uOff.value.set(P.x, 0, P.z);
  waveU.uOff.value.set(0, 0, Math.round(P.z / 12) * 12);
  if (CLK.msgT > 0 && (CLK.msgT -= dt) <= 0) msgEl.classList.remove('on');
  whiteEl.style.opacity = CLK.white.toFixed(3);
  if ((hudT -= dt) <= 0) { hudT = 0.2; updateHud(depthNow, dist, wob); }

  gpuBegin('sk'); updateSkyCube(); gpuEnd();
  gpuBegin('sc'); renderer.setRenderTarget(POST.hdr); renderer.clear(); renderer.render(scene, camera); gpuEnd();
  gpuBegin('po'); postRender(now / 1000); gpuEnd();
  gpuFrameEnd();
  requestAnimationFrame(frame);
}
try { renderer.compile(scene, camera); renderer.compile(skyScene, camera); } catch (e) { /* lanjut tanpa pra-kompilasi */ }
requestAnimationFrame(frame);
window.__millar = { THREE, scene, camera, renderer, CONFIG, PRESETS, PRESET, applyPreset, MOODS, MOOD, setMood, U, SKYU, P, CLK, STATE, POST, GPUT,
  frontX, waveTop, waterAt, seabed, chopAt, CHOP, stepPlayer, simStep, start, t, I18N, keys, seaNear, seaFar, wave, spray, mist, SKYCUBE };
requestAnimationFrame(() => requestAnimationFrame(() => { window.__millarReady = true; }));
</script>
