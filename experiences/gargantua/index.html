<title>Gargantua Black Hole</title>
<style>
  :root {

  #ui.collapsed header .chev { transform: rotate(-90deg); }

  #toast { left: 50%; top: 30%; transform: translateX(-50%); font-size: 12px; color: #dfe3ea; background: rgba(10,11,15,0.7); padding: 8px 14px;

<script>
'use strict';
/* =====================================================================
   CONFIG: every tunable parameter lives here
   ===================================================================== */
const CONFIG = {
  quality: 'medium',
  presets: {
    //        max RK steps | step factor (dt = k*r) | fbm octaves | max render scale
    low:    { steps: 120, stepK: 0.085, octaves: 3, scale: 0.6 },
    medium: { steps: 200, stepK: 0.060, octaves: 4, scale: 0.8 },
    high:   { steps: 320, stepK: 0.040, octaves: 5, scale: 1.0 },
    ultra:  { steps: 500, stepK: 0.025, octaves: 5, scale: 1.0 },
  },
  adaptive: true,          // adaptive resolution
  renderScale: 0.8,        // current internal resolution factor
  minScale: 0.4,
  maxDPR: 2,
  disk: { rIn: 3.0, rOut: 12.0, brightness: 1.0, turbulence: 0.75, speed: 1.0, opacity: 0.9 },
  physics: { film: true, doppler: true, redshift: true, spin: 0.0 },
  post: { exposure: 1.0, bloom: 0.9, streak: 0.25, grain: 0.35, threshold: 1.0, vignette: 0.4 },
  camera: { dist: 22, yaw: 0.35, pitch: 5, fov: 55, minDist: 6, maxDist: 60, autoOrbit: false, orbitSpeed: 0.035 },
  sky: { stars: 1.0, escape: 50 },
  flowPeriod: 30,          // disk texture re-seed period (sim units) to bound differential shear
  timeScale: 3.0,          // sim time units per second at speed 1
};

/* =====================================================================
   SHADERS
   ===================================================================== */
const VS = `#version 300 es
out vec2 vUv;
void main() {
  // single fullscreen triangle, no vertex buffers
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const COMMON = `#version 300 es
precision highp float;
precision highp int;
// PCG 3D hash (Jarzynski & Olano 2020): stable integer hash, no sin() precision issues
uvec3 pcg3d(uvec3 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
vec3 hash33(vec3 p) {
  uvec3 u = pcg3d(uvec3(ivec3(floor(p)) + 1048576));
  return vec3(u) * (1.0 / 4294967295.0);
}
`;

const SCENE_FS = COMMON + `
out vec4 outColor;
uniform vec2  uRes;
uniform vec3  uCamPos, uCamFwd, uCamRight, uCamUp;
uniform float uTanHalf, uPixAngle;
uniform float uTime;
uniform int   uMaxSteps, uOct;
uniform float uStepK, uEscape;
uniform float uRin, uRout, uDiskBright, uTurb, uOpacity, uFlowPeriod;
uniform float uFilm, uDoppler, uRedshift, uSpin;
uniform float uStars;
uniform float uEnc;
// G2: kamera wahana jatuh (uFall = 1). uObsV = kecepatan wahana di kerangka rain (pengamat jatuh dari diam di tak hingga),
// uObsG = Lorentz gamma-nya, uBeta = sqrt(rs / r) di posisi kamera. uFall = 0: perilaku lama persis.
uniform float uFall, uObsG, uBeta;
uniform vec3 uObsV;
float gObsK = 1.0;                   // G2: frekuensi teramati / frekuensi di tak hingga untuk sinar piksel ini

// Geometric units: G = c = 1, Schwarzschild radius rs = 1  =>  M = 0.5
const float RS = 1.0;
const float M  = 0.5;
const int MAX_ITER = 600;

float hash13(vec3 p) { return hash33(p).x; }

float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  float a = hash13(i),                 b = hash13(i + vec3(1,0,0));
  float c = hash13(i + vec3(0,1,0)),   d = hash13(i + vec3(1,1,0));
  float e = hash13(i + vec3(0,0,1)),   f1 = hash13(i + vec3(1,0,1));
  float g = hash13(i + vec3(0,1,1)),   h = hash13(i + vec3(1,1,1));
  return mix(mix(mix(a,b,u.x), mix(c,d,u.x), u.y), mix(mix(e,f1,u.x), mix(g,h,u.x), u.y), u.z);
}

float fbm(vec3 p) {
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 5; i++) {
    if (i >= uOct) break;
    s += a * vnoise(p); n += a;
    p = p * 2.03 + vec3(1.7, 9.2, 3.1);
    a *= 0.5;
  }
  return s / n;
}

// Relative Planck radiance B(lambda,T) sampled at ~R/G/B wavelengths, normalised to max channel = 1.
// B ~ 1 / (lambda^5 * (exp(hc / (lambda k T)) - 1)),  hc/k = 1.4388e-2 m*K
vec3 blackbody(float T) {
  vec3 lam = vec3(610e-9, 550e-9, 465e-9);
  vec3 x = 1.4388e-2 / (lam * T);
  vec3 l5 = pow(lam / 550e-9, vec3(5.0));
  vec3 b = 1.0 / (l5 * (exp(min(x, vec3(80.0))) - 1.0));
  return b / max(max(b.r, b.g), b.b);
}

// Film palette: warm white core -> amber -> deep orange
vec3 filmRamp(float t) {
  vec3 c = mix(vec3(0.42, 0.11, 0.02), vec3(1.00, 0.46, 0.12), smoothstep(0.30, 0.55, t));
  c = mix(c, vec3(1.00, 0.78, 0.52), smoothstep(0.55, 0.80, t));
  c = mix(c, vec3(1.00, 0.95, 0.88), smoothstep(0.80, 1.00, t));
  return c;
}

// Photon "acceleration" in Schwarzschild spacetime (Cartesian form of the Binet equation
// u'' + u = 3 M u^2):  a = -(3/2) rs h^2 r_vec / r^5, with h = |r x v| conserved.
// Optional spin term: gravitomagnetic (Lense-Thirring-like) dipole, a clearly LABELLED APPROXIMATION,
// not a Kerr geodesic.
vec3 accel(vec3 p, vec3 v, float h2) {
  float r2 = dot(p, p);
  float r = sqrt(r2);
  vec3 a = -1.5 * RS * h2 * p / (r2 * r2 * r);
  if (uSpin > 0.0) {
    vec3 J = vec3(0.0, -uSpin * M * M, 0.0);   // disk rotates x->z, so its angular momentum points -y
    vec3 n = p / r;
    vec3 B = (3.0 * dot(J, n) * n - J) / (r2 * r);
    a += 1.5 * cross(v, B) * smoothstep(1.0, 2.0, r);   // faded near the horizon to avoid cusps
  }
  return a;
}

// Disk pattern: radial frequency high, azimuthal frequency low -> streaks along the orbit
float diskPattern(float r, float ang, float seed) {
  vec2 cs = vec2(cos(ang), sin(ang));
  vec3 p = vec3(r * 1.6, cs * 2.2) + seed;
  float n = fbm(p);
  vec3 q = vec3(r * 5.5, cs * 4.5) + seed * 1.7 + n * 0.8;   // fine filaments, domain-warped
  float f = fbm(q);
  return clamp(0.45 * n + 0.75 * f - 0.1, 0.0, 1.0);
}

// Differential (Keplerian) rotation: omega = sqrt(M / r^3). Two phase-offset layers are
// cross-faded so the sheared texture never winds up into infinitely thin spirals.
float diskDensity(float r, float phi, float t) {
  float omega = sqrt(M / (r * r * r));
  float P = uFlowPeriod;
  float c1 = fract(t / P);
  float c2 = fract(t / P + 0.5);
  float w1 = 1.0 - abs(2.0 * c1 - 1.0);
  float n1 = diskPattern(r, phi - omega * c1 * P, 0.0);
  float n2 = diskPattern(r, phi - omega * c2 * P, 37.0);
  return mix(n2, n1, w1);
}

vec4 shadeDisk(vec3 hit, vec3 vel, float r) {
  float phi = atan(hit.z, hit.x);
  // Novikov-Thorne-like temperature: T ~ r^-3/4 (1 - k sqrt(rIn/r))^1/4 ; k = 0.85 softens the
  // zero-torque inner edge so the ISCO rim stays bright (as in the film). Normalised to 1 at rIn.
  float x = r / uRin;
  float Tn = pow(x, -0.75) * pow(max(1.0 - 0.85 * inversesqrt(x), 0.0), 0.25) / 0.62233;
  float edgeIn  = smoothstep(0.0, 0.3, r - uRin);
  float edgeOut = 1.0 - smoothstep(uRout - 0.35 * (uRout - uRin), uRout, r);

  float pat  = diskDensity(r, phi, uTime);
  float dens = mix(1.0, pow(pat, 1.5) * 2.6, uTurb);
  float alpha = clamp(dens * uOpacity, 0.0, 1.0) * edgeIn * edgeOut;
  float I = uDiskBright * (0.05 + 2.2 * pow(Tn, 3.0)) * mix(1.0, pow(pat * 1.7, 2.0), uTurb);

  // Gravitational redshift between emitter at r and observer at camera radius: g = sqrt(1-rs/r)/sqrt(1-rs/rc)
  float rc = length(uCamPos);
  float g;
  if (uFall > 0.5) g = mix(1.0, sqrt(max(1.0 - RS / r, 1e-4)) * gObsK, uRedshift);   // G2: pengamat = wahana jatuh
  else g = mix(1.0, sqrt(max(1.0 - RS / r, 1e-4)) / sqrt(1.0 - RS / rc), uRedshift);

  // Doppler factor D = 1 / (gamma (1 - beta . n)), n = photon propagation direction (towards camera)
  float D = 1.0;
  if (uDoppler * (1.0 - uFilm) > 0.5) {
    vec3 tdir = normalize(vec3(-hit.z, 0.0, hit.x));
    float v = min(sqrt(M / max(r - 2.0 * M, 1e-3)), 0.99);   // circular-orbit speed seen by static observer
    float gamma = inversesqrt(1.0 - v * v);
    vec3 n = -normalize(vel);
    D = 1.0 / (gamma * (1.0 - dot(v * tdir, n)));
  }

  vec3 col;
  if (uFilm > 0.5) {
    // Film mode: no Doppler colour shift or beaming, symmetric warm palette
    col = filmRamp(Tn);
    I *= g * g;
    if (uFall > 0.5) I = min(I, 60.0);
  } else {
    float shift = g * D;
    col = blackbody(max(7500.0 * Tn * shift, 800.0));    // observed temperature T_obs = g D T_emit
    I *= 0.7 * pow(shift, 4.0);                             // bolometric beaming ~ (gD)^4
    if (uFall > 0.5) I = min(I, 60.0);
  }
  return vec4(col * I, alpha);
}

vec3 starLayer(vec3 d, float scale, float density, float seed, float bright) {
  vec3 p = d * scale;
  vec3 cell = floor(p);
  vec3 h = hash33(cell + seed);
  if (h.x > density) return vec3(0.0);
  vec3 h2 = hash33(cell + seed + 71.0);
  vec3 sp = normalize(cell + 0.2 + 0.6 * h2) * scale;
  float dist = length(p - sp);
  float sig = uPixAngle * scale * 0.85;           // ~1 pixel, in cell units
  float fade = smoothstep(0.35, 0.12, sig);        // layer too dense for this resolution: fade out
  if (fade <= 0.0) return vec3(0.0);
  sig = min(sig, 0.15);
  float mag = fade * bright * (0.2 + 9.0 * pow(h.y, 16.0));
  float core = exp(-dist * dist / (sig * sig));
  float glow = 0.015 * sig / (dist + sig) * step(0.93, h.y);
  vec3 tint = mix(vec3(1.0), blackbody(3200.0 + 9000.0 * h.z), 0.55);
  return tint * mag * (core + glow);
}

vec3 sky(vec3 d) {
  vec3 c = vec3(0.0);
  c += starLayer(d, 55.0, 0.10, 0.0, 0.45);
  c += starLayer(d, 130.0, 0.08, 311.0, 0.30);
  c += starLayer(d, 300.0, 0.05, 733.0, 0.22);
  // faint galactic band, tilted relative to the disk plane
  vec3 bn = normalize(vec3(0.35, 1.0, -0.45));
  float b = dot(d, bn);
  float band = exp(-b * b * 14.0);
  float neb = fbm(d * 4.0 + 11.0);
  float dust = smoothstep(0.45, 0.75, fbm(d * 9.0 + 3.0));
  c += band * (0.010 + 0.045 * neb * neb) * mix(vec3(0.55, 0.62, 0.85), vec3(0.75, 0.62, 0.5), neb) * (1.0 - 0.7 * dust);
  return c * uStars;
}

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
  vec3 dir = normalize(uCamFwd + (uv.x * uCamRight + uv.y * uCamUp) * uTanHalf);

  vec3 pos = uCamPos;
  vec3 vel = dir;
  if (uFall > 0.5) {
    // G2: wahana jatuh. Foton tiba merambat ke arah -dir di kerangka wahana; aberasi ke kerangka rain (bentuk tanpa bagi v^2).
    // Di kerangka rain (koordinat Painleve-Gullstrand) p^r = eps (cos a - beta), jadi jejak mundur datar = -n + beta r_hat.
    // Berlaku juga di dalam horizon (beta > 1): semua jejak mundur menuju r lebih besar.
    vec3 np = -dir;
    float vn = dot(uObsV, np);
    vec3 pr = np + uObsV * (uObsG + uObsG * uObsG / (uObsG + 1.0) * vn);   // |pr| = gamma (1 + v.n') > 0
    float pl = max(length(pr), 1e-6);
    vec3 nr = pr / pl;
    vec3 rh = pos / max(length(pos), 1e-6);
    float ek = 1.0 - uBeta * dot(nr, rh);                                    // E / eps_rain
    if (ek < 1e-3) { outColor = vec4(0.0, 0.0, 0.0, 1.0); return; }          // E <= 0: datang dari cakrawala masa lalu, gelap
    gObsK = 1.0 / (pl * ek);
    vel = -nr + uBeta * rh;
    vel /= max(length(vel), 1e-6);
  }
  vec3 L = cross(pos, vel);
  float h2 = dot(L, L);              // conserved (specific angular momentum)^2

  vec3 col = vec3(0.0);
  float trans = 1.0;
  int state = 0;                     // 0 running, 1 absorbed, 2 escaped, 3 opaque

  for (int i = 0; i < MAX_ITER; i++) {
    if (i >= uMaxSteps) break;
    float r = length(pos);
    // adaptive step: proportional to r, extra refinement around the photon sphere (r = 1.5 rs)
    float dt = uStepK * r * mix(0.4, 1.0, clamp(abs(r - 1.5) / 1.5, 0.0, 1.0));
    dt = min(dt, 2.5);
    if (uFall > 0.5) dt /= max(length(vel), 0.05);                    // G2: langkah = jarak tempuh (laju datar jauh dari 1 dekat r kecil)

    // velocity Verlet
    vec3 prev = pos;
    vec3 a0 = accel(pos, vel, h2);
    pos += vel * dt + 0.5 * a0 * dt * dt;
    vec3 a1 = accel(pos, vel + a0 * dt, h2);
    vel += 0.5 * (a0 + a1) * dt;

    // thin-disk crossing (plane y = 0): interpolate hit, composite front-to-back
    if (prev.y * pos.y < 0.0) {
      float t = prev.y / (prev.y - pos.y);
      vec3 hit = mix(prev, pos, t);
      float rh = length(hit.xz);
      if (rh > uRin && rh < uRout) {
        vec4 dcol = shadeDisk(hit, vel, rh);
        col += trans * dcol.rgb * dcol.a;
        trans *= 1.0 - dcol.a;
        if (trans < 0.01) { state = 3; break; }
      }
    }

    float rn = length(pos);
    if (rn < RS && (uFall < 0.5 || dot(pos, vel) < 0.0 || rn < 2e-3)) { state = 1; break; }   // captured by the horizon

    if (rn > uEscape && dot(pos, vel) > 0.0) { state = 2; break; }  // escaped to infinity

  if (state == 0 && length(pos) > 4.0 && dot(pos, vel) > 0.0) state = 2;
  if (state == 2) {
    vec3 sc = sky(normalize(vel));
    if (uFall > 0.5 && uRedshift > 0.5) {                            // G2: langit bergeser frekuensi untuk wahana jatuh
      float sk = clamp(gObsK, 0.02, 12.0);
      sc *= uFilm > 0.5 ? vec3(min(sk * sk, 6.0)) : min(pow(vec3(sk), vec3(2.8, 3.6, 4.4)), vec3(40.0));
    }
    col += trans * sc;
  }

  outColor = vec4(col * uEnc, 1.0);
}`;

const BRIGHT_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform float uThr, uDec, uEnc;
void main() {
  vec3 c = texture(uTex, vUv).rgb * uDec;
  float l = max(max(c.r, c.g), c.b);
  float k = l - uThr;
  k = k < 0.5 ? (k > -0.5 ? (k + 0.5) * (k + 0.5) * 0.5 : 0.0) : k;   // soft knee
  o = vec4(c * (k / max(l, 1e-4)) * uEnc, 1.0);
}`;

const DOWN_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel;
void main() {
  vec2 d = uTexel;
  vec3 c = texture(uTex, vUv + vec2(-d.x, -d.y)).rgb + texture(uTex, vUv + vec2(d.x, -d.y)).rgb
         + texture(uTex, vUv + vec2(-d.x,  d.y)).rgb + texture(uTex, vUv + vec2(d.x,  d.y)).rgb;
  o = vec4(c * 0.25, 1.0);
}`;

const BLUR_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel, uDir;
void main() {
  // 9-tap Gaussian using 5 bilinear fetches
  vec2 o1 = uDir * uTexel * 1.3846153846, o2 = uDir * uTexel * 3.2307692308;
  vec3 c = texture(uTex, vUv).rgb * 0.2270270270;
  c += (texture(uTex, vUv + o1).rgb + texture(uTex, vUv - o1).rgb) * 0.3162162162;
  c += (texture(uTex, vUv + o2).rgb + texture(uTex, vUv - o2).rgb) * 0.0702702703;
  o = vec4(c, 1.0);
}`;

const STREAK_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uStride;
void main() {
  // dilated horizontal blur, applied 3x with growing stride -> long anamorphic streak
  vec3 c = vec3(0.0); float ws = 0.0;
  for (int i = -6; i <= 6; i++) {
    float w = exp(-abs(float(i)) * 0.45);
    c += texture(uTex, vUv + vec2(float(i) * uStride * uTexel.x, 0.0)).rgb * w;
    ws += w;
  }
  o = vec4(c / ws, 1.0);
}`;

const COMPOSITE_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uB0, uB1, uB2, uB3, uStreak;
uniform float uExposure, uBloom, uStreakAmt, uGrain, uVig, uDec;
uniform vec2 uRes; uniform uint uFrame;
// ACES filmic fit (Narkowicz 2015)
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main() {
  vec3 c = texture(uScene, vUv).rgb * uDec;
  vec3 b = (texture(uB0, vUv).rgb * 0.30 + texture(uB1, vUv).rgb * 0.30
          + texture(uB2, vUv).rgb * 0.22 + texture(uB3, vUv).rgb * 0.18) * uDec;
  vec3 s = texture(uStreak, vUv).rgb * uDec;
  c += b * uBloom + s * uStreakAmt * vec3(0.9, 0.95, 1.0);
  c = aces(c * uExposure);
  vec2 q = vUv - 0.5; q.x *= uRes.x / uRes.y;
  c *= 1.0 - uVig * smoothstep(0.35, 1.15, length(q));

  c += n * uGrain * 0.05 * (0.4 + 0.6 * (1.0 - c));
  o = vec4(c, 1.0);
}`;

/* G1b: raster wahana GX-01. Wahana 27,5 m jauh lebih kecil dari rs (2,954e11 m), jadi pembelokan cahaya di skala wahana
   diabaikan: digambar raster biasa dalam meter, di atas hasil ray tracing, sebelum bloom. Cahaya utama dari piringan.
   Pencahayaan di ruang pandang. Tidak ada pow() dengan basis negatif (NaN di M1). */
const SHIP_VS = `#version 300 es
in vec3 aPos; in vec3 aNrm; in vec3 aCol; in float aMat; in vec2 aUV;
uniform mat4 uMV, uProj; uniform mat3 uRot; uniform float uScale;
out vec3 vN, vCol, vV; out float vMat; out vec2 vUV;
void main() {
  vec4 v = uMV * vec4(aPos * uScale, 1.0);
  vV = v.xyz; vN = uRot * aNrm; vCol = aCol; vMat = aMat; vUV = aUV;
  gl_Position = uProj * v;
}`;
const SHIP_FS = `#version 300 es
precision highp float;
in vec3 vN, vCol, vV; in float vMat; in vec2 vUV;
out vec4 o;
uniform vec3 uL, uLCol, uAmb, uUpV;                                   // uUpV = sumbu atas wahana di ruang pandang
uniform float uEnc, uCockpit, uMode;                                // uMode: 0 badan, 1 stensil, 2 layar MFD (memancar)
uniform sampler2D uTex;
void main() {
  if (uMode > 1.5) { o = vec4(texture(uTex, vUV).rgb * 1.3 * uEnc, 1.0); return; }
  if (uMode > 0.5 && texture(uTex, vUV).a < 0.5) discard;           // stensil GX-01
  bool glass = vMat > 0.5 && vMat < 1.5, inner = vMat > 1.5;
  if (glass && uCockpit > 0.5) discard;                              // dari kokpit: kaca bening, sekat tetap
  float nl = length(vN);
  vec3 n = nl > 1e-4 ? vN / nl : vec3(0.0, 0.0, 1.0);
  vec3 V = length(vV) > 1e-4 ? normalize(-vV) : vec3(0.0, 0.0, 1.0);
  vec3 c;
  if (!gl_FrontFacing) {
    c = vCol * vec3(0.05, 0.045, 0.04) + vCol * uLCol * 0.02;        // sisi dalam lambung (kabin redup)
  } else if (inner) {                                                // interior kokpit: cahaya piringan lewat kaca + pendar layar
    float ndl = max(dot(n, uL), 0.0);
    float through = smoothstep(-0.05, 0.45, dot(uL, uUpV));          // cahaya masuk lewat kanopi (kaca di bagian atas)
    c = vCol * (uLCol * ndl * 0.5 * through + vec3(0.05, 0.055, 0.06));
  } else if (glass) {
    float fr = 0.04 + 0.96 * pow(clamp(1.0 - dot(n, V), 0.0, 1.0), 5.0);
    float sp = pow(max(dot(reflect(-V, n), uL), 0.0), 40.0);
    c = vec3(0.006, 0.008, 0.011) + uLCol * (0.6 * sp + 0.12 * fr);
  } else {
    float ndl = max(dot(n, uL), 0.0);
    float sp = pow(max(dot(reflect(-V, n), uL), 0.0), 24.0) * ndl;
    c = vCol * (uLCol * ndl + uAmb) + uLCol * 0.12 * sp;
  }
  o = vec4(c * uEnc, 1.0);
}`;

      g.font = `${11 * s}px ui-monospace, Menlo, Consolas, monospace`; g.textAlign = 'center';
      g.fillStyle = 'rgba(6,8,11,0.45)'; const tw = g.measureText(hint).width + 20 * s; g.fillRect((w - tw) / 2, h - 34 * s, tw, 20 * s);
      g.fillStyle = 'rgba(215,220,226,0.85)'; g.fillText(hint, w / 2, h - 24 * s); g.textAlign = 'left';

  }

  /* =====================================================================
     INPUT
     ===================================================================== */
  const pointers = new Map();
  let pinchStart = null;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('dragging');
    state.tween = null;
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: cam.dist }; }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1 && MIS.on && MIS.att) {                // G2: geser = arah hidung wahana (mematikan kunci ke pusat)
      if (MIS.lock !== 'free' && Math.hypot(dx, dy) > 2) { MIS.lock = 'free'; toast(txt(lockName('free')) + ' · X', 2.5); }
      if (MIS.lock === 'free') {
        const A = MIS.att, ya = -dx * 0.003, pa = -dy * 0.003;
        let f = v3.norm(v3.add(v3.mul(A.f, Math.cos(ya)), v3.mul(A.r, -Math.sin(ya))));
        f = v3.norm(v3.add(v3.mul(f, Math.cos(pa)), v3.mul(A.u, Math.sin(pa))));
        MIS.att = attTo(f, A.u);
      }
    } else if (pointers.size === 1) {
      cam.yaw -= dx * 0.005;
      cam.pitch = Math.max(-89, Math.min(89, cam.pitch + dy * 0.25));
    } else if (pointers.size === 2 && pinchStart) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      cam.dist = clampDist(pinchStart.dist * pinchStart.d / Math.max(d, 1));
    }
  });
  const endPointer = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinchStart = null; if (!pointers.size) canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault(); state.tween = null;
    if (MIS.on) { MIS.chase = Math.max(15, Math.min(400, MIS.chase * Math.exp(e.deltaY * 0.001))); return; }
    cam.dist = clampDist(cam.dist * Math.exp(e.deltaY * 0.001));
  }, { passive: false });
  const clampDist = (d) => Math.max(cam.minDist, Math.min(cam.maxDist, d));

  /* Tombol standar aplikasi (patokan Copper Corn Station, docs/app/tombol.md): Q kualitas, P efek layar, F mode foto (Enter simpan),

  function cycleQuality() {

  }
  function cyclePost() { state.postMode = (state.postMode + 1) % POST_MODES.length; toast(txt('Screen effects: {m}').replace('{m}', txt(POST_MODES[state.postMode].name))); }
  function togglePhoto(on = !state.photo) { state.photo = on; document.body.classList.toggle('photo', on); if (on) toast(txt('Photo mode: Enter saves PNG, F or Esc exits'), 3); }
  function toggleFullscreen() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); }

    if (!$('#help').hidden && (c === 'Escape' || c === 'Slash' || c === 'F1')) { e.preventDefault(); toggleHelp(false); return; }
    if (c === 'Slash' || c === 'F1') { e.preventDefault(); toggleHelp(true); return; }
    if (MIS.on && ['KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyR', 'KeyF', 'ShiftLeft', 'ShiftRight'].includes(c)) { MIS.keys.add(c); e.preventDefault(); return; }
    if (e.repeat) return;
    if (MIS.on) {
      if (c === 'Escape') { if (MIS.end) $('#mend').hidden = true; stopMission(); toast(txt('Mission ended'), 2); return; }
      if (c === 'KeyX') { MIS.lock = LOCKS[(LOCKS.indexOf(MIS.lock) + 1) % LOCKS.length]; toast(txt(lockName(MIS.lock)), 2); syncUI(); return; }
      if (c === 'KeyZ') { MIS.warp = (MIS.warp + 1) % WARPS.length; toast(txt('Time: {m}').replace('{m}', txt(WARPS[MIS.warp].name)), 1.5); return; }

    else if (c === 'KeyH') { $('#ui').classList.toggle('hidden'); $('#caption').classList.toggle('hidden'); $('#hint').classList.toggle('hidden'); }

  /* =====================================================================
     RENDER LOOP
     ===================================================================== */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDPR);
    const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }

  function updateStats(dt) {
    state.fpsFrames++; state.fpsTime += dt;
    if (state.fpsTime < 0.5) return;
    state.fps = state.fpsFrames / state.fpsTime;
    if (CONFIG.adaptive) {
      if (state.fps < 30) state.lowTime += state.fpsTime; else state.lowTime = 0;
      if (state.fps > 55) state.highTime += state.fpsTime; else state.highTime = 0;
      if (state.lowTime >= 2 && CONFIG.renderScale > CONFIG.minScale) {
        CONFIG.renderScale = Math.max(CONFIG.minScale, +(CONFIG.renderScale - 0.1).toFixed(2)); state.lowTime = 0;
      } else if (state.highTime >= 2 && CONFIG.renderScale < Q().scale) {
        CONFIG.renderScale = Math.min(Q().scale, +(CONFIG.renderScale + 0.1).toFixed(2)); state.highTime = 0;
      }
    }
    $('#rFps').textContent = state.fps.toFixed(1);
    $('#rRes').textContent = T ? `${T.sw}x${T.sh} (${Math.round(CONFIG.renderScale * 100)}%)` : '-';
    $('#rSteps').textContent = Q().steps;
    $('#rDist').textContent = (MIS.on ? Math.hypot(...MIS.x) : cam.dist).toFixed(MIS.on ? 3 : 1) + ' rs';
    $('#rFmt').textContent = FMT.name;
    state.fpsFrames = 0; state.fpsTime = 0;
  }

  function frame(now) {
    if (state.halt) return;   // debugging hook: stops the loop
    const dt = Math.min(0.1, Math.max(0, (now - state.last) / 1000));
    state.last = now;
    if (!state.paused) state.simTime += dt * CONFIG.timeScale * CONFIG.disk.speed;
    state.frame = (state.frame + 1) >>> 0;

    // camera animation
    if (state.tween) {
      const tw = state.tween; tw.t += dt;
      const k = ease(Math.min(1, tw.t / tw.dur));
      for (const key of ['dist', 'pitch', 'yaw', 'fov']) cam[key] = tw.from[key] + (tw.to[key] - tw.from[key]) * k;
      if (tw.t >= tw.dur) state.tween = null;
    }
    if (cam.autoOrbit && !state.paused && pointers.size === 0) cam.yaw += cam.orbitSpeed * dt;

    resize();
    const sw = Math.max(8, Math.round(canvas.width * CONFIG.renderScale));
    const sh = Math.max(8, Math.round(canvas.height * CONFIG.renderScale));
    buildTargets(sw, sh);

    stepMission(dt);
    const b = viewBasis();
    const q = Q();
    const tanHalf = Math.tan((b.fov || cam.fov) * Math.PI / 360);
    const enc = FMT.enc, dec = 1 / FMT.enc;

    // 1) ray-traced scene (HDR)
    pass(P.scene, T.scene, (p) => {
      gl.uniform2f(p.u('uRes'), sw, sh);
      gl.uniform3fv(p.u('uCamPos'), b.pos); gl.uniform3fv(p.u('uCamFwd'), b.f);
      gl.uniform3fv(p.u('uCamRight'), b.r); gl.uniform3fv(p.u('uCamUp'), b.u);
      gl.uniform1f(p.u('uTanHalf'), tanHalf);
      gl.uniform1f(p.u('uPixAngle'), 2 * tanHalf / sh);
      gl.uniform1f(p.u('uTime'), state.simTime);
      gl.uniform1i(p.u('uMaxSteps'), b.obs ? Math.min(600, Math.round(q.steps * 1.6)) : q.steps);   // G2: sinar dari dalam horizon butuh lebih banyak langkah
      gl.uniform1f(p.u('uFall'), b.obs ? 1 : 0);
      gl.uniform3fv(p.u('uObsV'), b.obs ? b.obs.v : [0, 0, 0]); gl.uniform1f(p.u('uObsG'), b.obs ? b.obs.g : 1); gl.uniform1f(p.u('uBeta'), b.obs ? b.obs.beta : 0);
      gl.uniform1i(p.u('uOct'), q.octaves);
      gl.uniform1f(p.u('uStepK'), q.stepK);
      gl.uniform1f(p.u('uEscape'), Math.max(CONFIG.sky.escape, (b.obs ? Math.hypot(...b.pos) : cam.dist) + 5));
      const d = CONFIG.disk;
      gl.uniform1f(p.u('uRin'), Math.min(d.rIn, d.rOut - 0.5));
      gl.uniform1f(p.u('uRout'), d.rOut);
      gl.uniform1f(p.u('uDiskBright'), d.brightness);
      gl.uniform1f(p.u('uTurb'), d.turbulence);
      gl.uniform1f(p.u('uOpacity'), d.opacity);
      gl.uniform1f(p.u('uFlowPeriod'), CONFIG.flowPeriod);
      const ph = CONFIG.physics;
      gl.uniform1f(p.u('uFilm'), ph.film ? 1 : 0);
      gl.uniform1f(p.u('uDoppler'), ph.doppler ? 1 : 0);
      gl.uniform1f(p.u('uRedshift'), ph.redshift ? 1 : 0);
      gl.uniform1f(p.u('uSpin'), ph.spin);
      gl.uniform1f(p.u('uStars'), CONFIG.sky.stars);
      gl.uniform1f(p.u('uEnc'), enc);
    });

    // 1b) G1: wahana GX-01 di atas hasil ray tracing, sebelum bloom
    if (SHIP.on && SHIP.ready && b.eye) { if (MIS.on && SHIP.view === 'cockpit') drawMFD(now); drawShip(b, sw, sh, tanHalf); }
    drawDash(now);
    if (state.readCb && FMT.type === gl.HALF_FLOAT) {                  // uji: statistik buffer HDR scene (nilai tidak valid, maks, rata-rata)
      const cb = state.readCb, px = new Float32Array(sw * sh * 4); state.readCb = null;
      gl.bindFramebuffer(gl.FRAMEBUFFER, T.scene.fb); gl.readPixels(0, 0, sw, sh, gl.RGBA, gl.FLOAT, px);
      let bad = 0, mx = 0, sum = 0;
      for (let i = 0; i < px.length; i += 4) for (let k = 0; k < 3; k++) { const v = px[i + k]; if (!Number.isFinite(v)) bad++; else { mx = Math.max(mx, v); sum += v; } }
      cb({ bad, max: mx, mean: sum / (sw * sh * 3), w: sw, h: sh });
    }

    // 2) bright pass -> bloom level 0
    const L = T.bloom;
    pass(P.bright, L[0].a, (p) => {
      tex(p, 'uTex', T.scene.tex, 0);
      gl.uniform1f(p.u('uThr'), CONFIG.post.threshold);
      gl.uniform1f(p.u('uDec'), dec); gl.uniform1f(p.u('uEnc'), enc);
    });
    // 3) bloom mip chain with separable blur
    const blur = (lvl) => {
      pass(P.blur, lvl.b, (p) => { tex(p, 'uTex', lvl.a.tex, 0); gl.uniform2f(p.u('uTexel'), 1 / lvl.a.w, 1 / lvl.a.h); gl.uniform2f(p.u('uDir'), 1, 0); });
      pass(P.blur, lvl.a, (p) => { tex(p, 'uTex', lvl.b.tex, 0); gl.uniform2f(p.u('uTexel'), 1 / lvl.b.w, 1 / lvl.b.h); gl.uniform2f(p.u('uDir'), 0, 1); });
    };
    blur(L[0]);
    for (let i = 1; i < L.length; i++) {
      pass(P.down, L[i].a, (p) => { tex(p, 'uTex', L[i - 1].a.tex, 0); gl.uniform2f(p.u('uTexel'), 0.5 / L[i - 1].a.w, 0.5 / L[i - 1].a.h); });
      blur(L[i]);
    }
    // 4) anamorphic streak from bloom level 1
    const PM = POST_MODES[state.postMode];
    if (CONFIG.post.streak * PM.streak > 0) {
      const strides = [1, 4, 14];
      let src = L[1].a, dst = T.sA;
      for (let i = 0; i < strides.length; i++) {
        pass(P.streak, dst, (p) => { tex(p, 'uTex', src.tex, 0); gl.uniform2f(p.u('uTexel'), 1 / src.w, 1 / src.h); gl.uniform1f(p.u('uStride'), strides[i]); });
        src = dst; dst = dst === T.sA ? T.sB : T.sA;
      }
      T.streakOut = src;
    } else T.streakOut = L[3].b;   // unused (amount 0), any valid texture

    // 5) composite + tone map to screen
    pass(P.composite, null, (p) => {
      tex(p, 'uScene', T.scene.tex, 0);
      tex(p, 'uB0', L[0].a.tex, 1); tex(p, 'uB1', L[1].a.tex, 2);
      tex(p, 'uB2', L[2].a.tex, 3); tex(p, 'uB3', L[3].a.tex, 4);
      tex(p, 'uStreak', T.streakOut.tex, 5);
      const po = CONFIG.post;
      gl.uniform1f(p.u('uExposure'), po.exposure); gl.uniform1f(p.u('uBloom'), po.bloom * PM.bloom);
      gl.uniform1f(p.u('uStreakAmt'), po.streak * PM.streak); gl.uniform1f(p.u('uGrain'), po.grain * PM.grain);
      gl.uniform1f(p.u('uVig'), po.vignette * PM.vig); gl.uniform1f(p.u('uDec'), dec);
      gl.uniform2f(p.u('uRes'), canvas.width, canvas.height);
      gl.uniform1ui(p.u('uFrame'), state.paused ? 0 : state.frame);
    });

    // screenshot in the same task as the draw (no preserveDrawingBuffer needed)
    if (state.shot) {
      state.shot = false;
      canvas.toBlob((blob) => {
        if (!blob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `gargantua-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }, 'image/png');
    }

    if (state.captureCb) { const cb = state.captureCb; state.captureCb = null; cb(canvas.toDataURL('image/png')); }   // test hook
    updateStats(dt);
    requestAnimationFrame(frame);
  }

  window.__gargantua = { CONFIG, state, cam, setPreset, fmt: FMT.name, POST_MODES, togglePhoto, cycleQuality, cyclePost, toggleHelp,
    SHIP, setShip, cycleShipView, viewBasis, MIS, SCEN, startMission, stopMission, misAdvance, rainOf, skyShift, misThrust, misData, MIS_T };   // debugging hook
  requestAnimationFrame(frame);
}

try { main(); } catch (e) { showError(String(e && e.message || e)); }
</script>
