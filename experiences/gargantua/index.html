<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gargantua Black Hole</title>
<style>
  :root {
    --panel-bg: rgba(10, 11, 15, 0.62);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #cfd3da;
    --muted: #7d838f;
    --accent: #f0a45a;
    --track: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--text);
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas#c.dragging { cursor: grabbing; }

  #ui { position: fixed; top: 16px; right: 16px; width: 272px; max-height: calc(100vh - 32px); overflow: auto;
    background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px;
    backdrop-filter: blur(14px) saturate(120%); -webkit-backdrop-filter: blur(14px) saturate(120%);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); user-select: none; transition: opacity .25s; }
  #ui.hidden, .overlay-text.hidden { opacity: 0; pointer-events: none; }
  #ui header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
    cursor: pointer; letter-spacing: .14em; text-transform: uppercase; font-size: 10px; color: var(--text); }
  #ui header .chev { transition: transform .2s; color: var(--muted); }
  #ui.collapsed header .chev { transform: rotate(-90deg); }
  #ui.collapsed .body { display: none; }
  #ui .body { padding: 0 12px 12px; }
  .sec { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--panel-border);
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin-top: 7px; }
  .row label { color: var(--text); }
  .row .val { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; height: 14px; background: transparent; -webkit-appearance: none; appearance: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--track); border-radius: 2px; }
  input[type=range]::-moz-range-track { height: 2px; background: var(--track); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; border-radius: 50%; background: var(--accent); border: none; }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: none; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 7px; cursor: pointer; }
  .check input { accent-color: var(--accent); margin: 0; }
  select, button { font: inherit; color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 4px 6px; cursor: pointer; }
  select option { background: #111; }
  button:hover, select:hover { border-color: rgba(240,164,90,0.5); }
  .btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
  .btns button { padding: 5px 4px; }
  .btns button kbd { color: var(--muted); font: inherit; margin-right: 4px; }
  #readout { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--panel-border); color: var(--muted);
    display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-variant-numeric: tabular-nums; }
  #readout b { color: var(--text); font-weight: normal; text-align: right; }
  .keys { margin-top: 8px; color: var(--muted); line-height: 1.6; }

  .overlay-text { position: fixed; color: rgba(220,224,232,0.55); pointer-events: none; letter-spacing: .08em; transition: opacity .25s; }
  #caption { left: 16px; bottom: 14px; font-size: 10.5px; }
  #hint { right: 16px; bottom: 14px; font-size: 10px; color: rgba(220,224,232,0.35); }
  #err { position: fixed; inset: 16px; overflow: auto; background: rgba(20,0,0,0.92); color: #ffb4a8; border: 1px solid #6b2a22;
    border-radius: 8px; padding: 16px; white-space: pre-wrap; font-size: 12px; z-index: 10; }
  #err[hidden] { display: none; }

  @media (max-width: 640px) {
    #ui { top: 12px; right: 12px; left: 12px; width: auto; max-height: 60vh; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <header id="uiHeader"><span>Gargantua Black Hole</span><span class="chev">&#9662;</span></header>
  <div class="body" id="uiBody"></div>
</div>
<div id="caption" class="overlay-text">Gargantua Black Hole · Schwarzschild ray-traced approximation</div>
<div id="hint" class="overlay-text">drag: orbit &middot; wheel/pinch: zoom &middot; 1-4: presets &middot; H: hide UI</div>
<pre id="err" hidden></pre>

<script>
'use strict';
/* =====================================================================
   CONFIG: every tunable parameter lives here
   ===================================================================== */
const CONFIG = {
  quality: 'medium',
  presets: {
    //        max RK steps | step factor (dt = k*r) | fbm octaves | max render scale
    low:    { steps: 120, stepK: 0.085, octaves: 3, scale: 0.6 },
    medium: { steps: 200, stepK: 0.060, octaves: 4, scale: 0.8 },
    high:   { steps: 320, stepK: 0.040, octaves: 5, scale: 1.0 },
    ultra:  { steps: 500, stepK: 0.025, octaves: 5, scale: 1.0 },
  },
  adaptive: true,          // adaptive resolution
  renderScale: 0.8,        // current internal resolution factor
  minScale: 0.4,
  maxDPR: 2,
  disk: { rIn: 3.0, rOut: 12.0, brightness: 1.0, turbulence: 0.75, speed: 1.0, opacity: 0.9 },
  physics: { film: true, doppler: true, redshift: true, spin: 0.0 },
  post: { exposure: 1.0, bloom: 0.9, streak: 0.25, grain: 0.35, threshold: 1.0, vignette: 0.4 },
  camera: { dist: 22, yaw: 0.35, pitch: 5, fov: 55, minDist: 6, maxDist: 60, autoOrbit: false, orbitSpeed: 0.035 },
  sky: { stars: 1.0, escape: 50 },
  flowPeriod: 30,          // disk texture re-seed period (sim units) to bound differential shear
  timeScale: 3.0,          // sim time units per second at speed 1
};

/* =====================================================================
   SHADERS
   ===================================================================== */
const VS = `#version 300 es
out vec2 vUv;
void main() {
  // single fullscreen triangle, no vertex buffers
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const COMMON = `#version 300 es
precision highp float;
precision highp int;
// PCG 3D hash (Jarzynski & Olano 2020): stable integer hash, no sin() precision issues
uvec3 pcg3d(uvec3 v) {
  v = v * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
vec3 hash33(vec3 p) {
  uvec3 u = pcg3d(uvec3(ivec3(floor(p)) + 1048576));
  return vec3(u) * (1.0 / 4294967295.0);
}
`;

const SCENE_FS = COMMON + `
out vec4 outColor;
uniform vec2  uRes;
uniform vec3  uCamPos, uCamFwd, uCamRight, uCamUp;
uniform float uTanHalf, uPixAngle;
uniform float uTime;
uniform int   uMaxSteps, uOct;
uniform float uStepK, uEscape;
uniform float uRin, uRout, uDiskBright, uTurb, uOpacity, uFlowPeriod;
uniform float uFilm, uDoppler, uRedshift, uSpin;
uniform float uStars;
uniform float uEnc;

// Geometric units: G = c = 1, Schwarzschild radius rs = 1  =>  M = 0.5
const float RS = 1.0;
const float M  = 0.5;
const int MAX_ITER = 600;

float hash13(vec3 p) { return hash33(p).x; }

float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  float a = hash13(i),                 b = hash13(i + vec3(1,0,0));
  float c = hash13(i + vec3(0,1,0)),   d = hash13(i + vec3(1,1,0));
  float e = hash13(i + vec3(0,0,1)),   f1 = hash13(i + vec3(1,0,1));
  float g = hash13(i + vec3(0,1,1)),   h = hash13(i + vec3(1,1,1));
  return mix(mix(mix(a,b,u.x), mix(c,d,u.x), u.y), mix(mix(e,f1,u.x), mix(g,h,u.x), u.y), u.z);
}

float fbm(vec3 p) {
  float s = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 5; i++) {
    if (i >= uOct) break;
    s += a * vnoise(p); n += a;
    p = p * 2.03 + vec3(1.7, 9.2, 3.1);
    a *= 0.5;
  }
  return s / n;
}

// Relative Planck radiance B(lambda,T) sampled at ~R/G/B wavelengths, normalised to max channel = 1.
// B ~ 1 / (lambda^5 * (exp(hc / (lambda k T)) - 1)),  hc/k = 1.4388e-2 m*K
vec3 blackbody(float T) {
  vec3 lam = vec3(610e-9, 550e-9, 465e-9);
  vec3 x = 1.4388e-2 / (lam * T);
  vec3 l5 = pow(lam / 550e-9, vec3(5.0));
  vec3 b = 1.0 / (l5 * (exp(min(x, vec3(80.0))) - 1.0));
  return b / max(max(b.r, b.g), b.b);
}

// Film palette: warm white core -> amber -> deep orange
vec3 filmRamp(float t) {
  vec3 c = mix(vec3(0.42, 0.11, 0.02), vec3(1.00, 0.46, 0.12), smoothstep(0.30, 0.55, t));
  c = mix(c, vec3(1.00, 0.78, 0.52), smoothstep(0.55, 0.80, t));
  c = mix(c, vec3(1.00, 0.95, 0.88), smoothstep(0.80, 1.00, t));
  return c;
}

// Photon "acceleration" in Schwarzschild spacetime (Cartesian form of the Binet equation
// u'' + u = 3 M u^2):  a = -(3/2) rs h^2 r_vec / r^5, with h = |r x v| conserved.
// Optional spin term: gravitomagnetic (Lense-Thirring-like) dipole, a clearly LABELLED APPROXIMATION,
// not a Kerr geodesic.
vec3 accel(vec3 p, vec3 v, float h2) {
  float r2 = dot(p, p);
  float r = sqrt(r2);
  vec3 a = -1.5 * RS * h2 * p / (r2 * r2 * r);
  if (uSpin > 0.0) {
    vec3 J = vec3(0.0, -uSpin * M * M, 0.0);   // disk rotates x->z, so its angular momentum points -y
    vec3 n = p / r;
    vec3 B = (3.0 * dot(J, n) * n - J) / (r2 * r);
    a += 1.5 * cross(v, B) * smoothstep(1.0, 2.0, r);   // faded near the horizon to avoid cusps
  }
  return a;
}

// Disk pattern: radial frequency high, azimuthal frequency low -> streaks along the orbit
float diskPattern(float r, float ang, float seed) {
  vec2 cs = vec2(cos(ang), sin(ang));
  vec3 p = vec3(r * 1.6, cs * 2.2) + seed;
  float n = fbm(p);
  vec3 q = vec3(r * 5.5, cs * 4.5) + seed * 1.7 + n * 0.8;   // fine filaments, domain-warped
  float f = fbm(q);
  return clamp(0.45 * n + 0.75 * f - 0.1, 0.0, 1.0);
}

// Differential (Keplerian) rotation: omega = sqrt(M / r^3). Two phase-offset layers are
// cross-faded so the sheared texture never winds up into infinitely thin spirals.
float diskDensity(float r, float phi, float t) {
  float omega = sqrt(M / (r * r * r));
  float P = uFlowPeriod;
  float c1 = fract(t / P);
  float c2 = fract(t / P + 0.5);
  float w1 = 1.0 - abs(2.0 * c1 - 1.0);
  float n1 = diskPattern(r, phi - omega * c1 * P, 0.0);
  float n2 = diskPattern(r, phi - omega * c2 * P, 37.0);
  return mix(n2, n1, w1);
}

vec4 shadeDisk(vec3 hit, vec3 vel, float r) {
  float phi = atan(hit.z, hit.x);
  // Novikov-Thorne-like temperature: T ~ r^-3/4 (1 - k sqrt(rIn/r))^1/4 ; k = 0.85 softens the
  // zero-torque inner edge so the ISCO rim stays bright (as in the film). Normalised to 1 at rIn.
  float x = r / uRin;
  float Tn = pow(x, -0.75) * pow(max(1.0 - 0.85 * inversesqrt(x), 0.0), 0.25) / 0.62233;
  float edgeIn  = smoothstep(0.0, 0.3, r - uRin);
  float edgeOut = 1.0 - smoothstep(uRout - 0.35 * (uRout - uRin), uRout, r);

  float pat  = diskDensity(r, phi, uTime);
  float dens = mix(1.0, pow(pat, 1.5) * 2.6, uTurb);
  float alpha = clamp(dens * uOpacity, 0.0, 1.0) * edgeIn * edgeOut;
  float I = uDiskBright * (0.05 + 2.2 * pow(Tn, 3.0)) * mix(1.0, pow(pat * 1.7, 2.0), uTurb);

  // Gravitational redshift between emitter at r and observer at camera radius: g = sqrt(1-rs/r)/sqrt(1-rs/rc)
  float rc = length(uCamPos);
  float g = mix(1.0, sqrt(max(1.0 - RS / r, 1e-4)) / sqrt(1.0 - RS / rc), uRedshift);

  // Doppler factor D = 1 / (gamma (1 - beta . n)), n = photon propagation direction (towards camera)
  float D = 1.0;
  if (uDoppler * (1.0 - uFilm) > 0.5) {
    vec3 tdir = normalize(vec3(-hit.z, 0.0, hit.x));
    float v = min(sqrt(M / max(r - 2.0 * M, 1e-3)), 0.99);   // circular-orbit speed seen by static observer
    float gamma = inversesqrt(1.0 - v * v);
    vec3 n = -normalize(vel);
    D = 1.0 / (gamma * (1.0 - dot(v * tdir, n)));
  }

  vec3 col;
  if (uFilm > 0.5) {
    // Film mode: no Doppler colour shift or beaming, symmetric warm palette
    col = filmRamp(Tn);
    I *= g * g;
  } else {
    float shift = g * D;
    col = blackbody(max(7500.0 * Tn * shift, 800.0));    // observed temperature T_obs = g D T_emit
    I *= 0.7 * pow(shift, 4.0);                             // bolometric beaming ~ (gD)^4
  }
  return vec4(col * I, alpha);
}

vec3 starLayer(vec3 d, float scale, float density, float seed, float bright) {
  vec3 p = d * scale;
  vec3 cell = floor(p);
  vec3 h = hash33(cell + seed);
  if (h.x > density) return vec3(0.0);
  vec3 h2 = hash33(cell + seed + 71.0);
  vec3 sp = normalize(cell + 0.2 + 0.6 * h2) * scale;
  float dist = length(p - sp);
  float sig = uPixAngle * scale * 0.85;           // ~1 pixel, in cell units
  float fade = smoothstep(0.35, 0.12, sig);        // layer too dense for this resolution: fade out
  if (fade <= 0.0) return vec3(0.0);
  sig = min(sig, 0.15);
  float mag = fade * bright * (0.2 + 9.0 * pow(h.y, 16.0));
  float core = exp(-dist * dist / (sig * sig));
  float glow = 0.015 * sig / (dist + sig) * step(0.93, h.y);
  vec3 tint = mix(vec3(1.0), blackbody(3200.0 + 9000.0 * h.z), 0.55);
  return tint * mag * (core + glow);
}

vec3 sky(vec3 d) {
  vec3 c = vec3(0.0);
  c += starLayer(d, 55.0, 0.10, 0.0, 0.45);
  c += starLayer(d, 130.0, 0.08, 311.0, 0.30);
  c += starLayer(d, 300.0, 0.05, 733.0, 0.22);
  // faint galactic band, tilted relative to the disk plane
  vec3 bn = normalize(vec3(0.35, 1.0, -0.45));
  float b = dot(d, bn);
  float band = exp(-b * b * 14.0);
  float neb = fbm(d * 4.0 + 11.0);
  float dust = smoothstep(0.45, 0.75, fbm(d * 9.0 + 3.0));
  c += band * (0.010 + 0.045 * neb * neb) * mix(vec3(0.55, 0.62, 0.85), vec3(0.75, 0.62, 0.5), neb) * (1.0 - 0.7 * dust);
  return c * uStars;
}

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
  vec3 dir = normalize(uCamFwd + (uv.x * uCamRight + uv.y * uCamUp) * uTanHalf);

  vec3 pos = uCamPos;
  vec3 vel = dir;
  vec3 L = cross(pos, vel);
  float h2 = dot(L, L);              // conserved (specific angular momentum)^2

  vec3 col = vec3(0.0);
  float trans = 1.0;
  int state = 0;                     // 0 running, 1 absorbed, 2 escaped, 3 opaque

  for (int i = 0; i < MAX_ITER; i++) {
    if (i >= uMaxSteps) break;
    float r = length(pos);
    // adaptive step: proportional to r, extra refinement around the photon sphere (r = 1.5 rs)
    float dt = uStepK * r * mix(0.4, 1.0, clamp(abs(r - 1.5) / 1.5, 0.0, 1.0));
    dt = min(dt, 2.5);

    // velocity Verlet
    vec3 prev = pos;
    vec3 a0 = accel(pos, vel, h2);
    pos += vel * dt + 0.5 * a0 * dt * dt;
    vec3 a1 = accel(pos, vel + a0 * dt, h2);
    vel += 0.5 * (a0 + a1) * dt;

    // thin-disk crossing (plane y = 0): interpolate hit, composite front-to-back
    if (prev.y * pos.y < 0.0) {
      float t = prev.y / (prev.y - pos.y);
      vec3 hit = mix(prev, pos, t);
      float rh = length(hit.xz);
      if (rh > uRin && rh < uRout) {
        vec4 dcol = shadeDisk(hit, vel, rh);
        col += trans * dcol.rgb * dcol.a;
        trans *= 1.0 - dcol.a;
        if (trans < 0.01) { state = 3; break; }
      }
    }

    float rn = length(pos);
    if (rn < RS) { state = 1; break; }                              // captured by the horizon
    if (rn > uEscape && dot(pos, vel) > 0.0) { state = 2; break; }  // escaped to infinity
  }
  // out of steps while clearly outbound: remaining bending is small, treat as escaped
  if (state == 0 && length(pos) > 4.0 && dot(pos, vel) > 0.0) state = 2;
  if (state == 2) col += trans * sky(normalize(vel));

  outColor = vec4(col * uEnc, 1.0);
}`;

const BRIGHT_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform float uThr, uDec, uEnc;
void main() {
  vec3 c = texture(uTex, vUv).rgb * uDec;
  float l = max(max(c.r, c.g), c.b);
  float k = l - uThr;
  k = k < 0.5 ? (k > -0.5 ? (k + 0.5) * (k + 0.5) * 0.5 : 0.0) : k;   // soft knee
  o = vec4(c * (k / max(l, 1e-4)) * uEnc, 1.0);
}`;

const DOWN_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel;
void main() {
  vec2 d = uTexel;
  vec3 c = texture(uTex, vUv + vec2(-d.x, -d.y)).rgb + texture(uTex, vUv + vec2(d.x, -d.y)).rgb
         + texture(uTex, vUv + vec2(-d.x,  d.y)).rgb + texture(uTex, vUv + vec2(d.x,  d.y)).rgb;
  o = vec4(c * 0.25, 1.0);
}`;

const BLUR_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel, uDir;
void main() {
  // 9-tap Gaussian using 5 bilinear fetches
  vec2 o1 = uDir * uTexel * 1.3846153846, o2 = uDir * uTexel * 3.2307692308;
  vec3 c = texture(uTex, vUv).rgb * 0.2270270270;
  c += (texture(uTex, vUv + o1).rgb + texture(uTex, vUv - o1).rgb) * 0.3162162162;
  c += (texture(uTex, vUv + o2).rgb + texture(uTex, vUv - o2).rgb) * 0.0702702703;
  o = vec4(c, 1.0);
}`;

const STREAK_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uStride;
void main() {
  // dilated horizontal blur, applied 3x with growing stride -> long anamorphic streak
  vec3 c = vec3(0.0); float ws = 0.0;
  for (int i = -6; i <= 6; i++) {
    float w = exp(-abs(float(i)) * 0.45);
    c += texture(uTex, vUv + vec2(float(i) * uStride * uTexel.x, 0.0)).rgb * w;
    ws += w;
  }
  o = vec4(c / ws, 1.0);
}`;

const COMPOSITE_FS = COMMON + `
in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uB0, uB1, uB2, uB3, uStreak;
uniform float uExposure, uBloom, uStreakAmt, uGrain, uVig, uDec;
uniform vec2 uRes; uniform uint uFrame;
// ACES filmic fit (Narkowicz 2015)
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main() {
  vec3 c = texture(uScene, vUv).rgb * uDec;
  vec3 b = (texture(uB0, vUv).rgb * 0.30 + texture(uB1, vUv).rgb * 0.30
          + texture(uB2, vUv).rgb * 0.22 + texture(uB3, vUv).rgb * 0.18) * uDec;
  vec3 s = texture(uStreak, vUv).rgb * uDec;
  c += b * uBloom + s * uStreakAmt * vec3(0.9, 0.95, 1.0);
  c = aces(c * uExposure);
  vec2 q = vUv - 0.5; q.x *= uRes.x / uRes.y;
  c *= 1.0 - uVig * smoothstep(0.35, 1.15, length(q));
  c = pow(c, vec3(1.0 / 2.2));
  uvec3 h = pcg3d(uvec3(uvec2(gl_FragCoord.xy), uFrame));
  float n = float(h.x) * (1.0 / 4294967295.0) - 0.5;
  c += n * uGrain * 0.05 * (0.4 + 0.6 * (1.0 - c));
  o = vec4(c, 1.0);
}`;

/* =====================================================================
   GL SETUP
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const errBox = $('#err');
function showError(msg) { errBox.hidden = false; errBox.textContent = msg; }

function main() {
  const canvas = $('#c');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false,
    premultipliedAlpha: false, powerPreference: 'high-performance' });
  if (!gl) {
    showError('WebGL2 is not available in this browser or on this GPU.\n\n' +
      'This simulation needs WebGL2 (Chrome, Edge, Firefox, Safari 15+). ' +
      'Check that hardware acceleration is enabled in your browser settings.');

  }
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); showError('WebGL context lost. Reload the page to restart.'); });

  // ---------- shader compile with readable errors ----------
  function compile(type, src, name) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s) || '';
      const lines = src.split('\n');
      const ctx = [];
      for (const m of log.matchAll(/\d+:(\d+):/g)) {
        const ln = +m[1];
        for (let i = Math.max(1, ln - 3); i <= Math.min(lines.length, ln + 3); i++)
          ctx.push((i === ln ? '>> ' : '   ') + String(i).padStart(4) + '  ' + lines[i - 1]);
        ctx.push('');
      }
      throw new Error(`[${name}] shader compile error\n\n${log}\n${ctx.join('\n')}`);
    }
    return s;
  }
  const vsObj = compile(gl.VERTEX_SHADER, VS, 'vertex');
  function program(fsSrc, name) {
    const p = gl.createProgram();
    gl.attachShader(p, vsObj);
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc, name));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(`[${name}] link error\n\n${gl.getProgramInfoLog(p)}`);
    const cache = new Map();
    return { p, u(n) { if (!cache.has(n)) cache.set(n, gl.getUniformLocation(p, n)); return cache.get(n); } };
  }

  const P = {
    scene: program(SCENE_FS, 'scene'),
    bright: program(BRIGHT_FS, 'bright'),
    down: program(DOWN_FS, 'down'),
    blur: program(BLUR_FS, 'blur'),
    streak: program(STREAK_FS, 'streak'),
    composite: program(COMPOSITE_FS, 'composite'),
  };
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  // ---------- framebuffer manager ----------
  const FMT = (() => {
    const ext = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
    if (ext) {
      const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 4, 4, 0, gl.RGBA, gl.HALF_FLOAT, null);
      const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(f); gl.deleteTexture(t);

    return { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE, enc: 1 / 8, name: 'RGBA8 (fallback)' };
  })();

  function makeTarget(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, FMT.internal, w, h, 0, gl.RGBA, FMT.type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  }
  function freeTarget(t) { gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }

  let T = null;   // all render targets
  function buildTargets(sw, sh) {
    if (T && T.sw === sw && T.sh === sh) return;
    if (T) { freeTarget(T.scene); T.bloom.forEach((l) => { freeTarget(l.a); freeTarget(l.b); }); freeTarget(T.sA); freeTarget(T.sB); }
    const bloom = [];
    for (let i = 1; i <= 4; i++) {
      const w = Math.max(1, Math.ceil(sw / 2 ** i)), h = Math.max(1, Math.ceil(sh / 2 ** i));
      bloom.push({ a: makeTarget(w, h), b: makeTarget(w, h) });
    }
    const s1 = bloom[1].a;
    T = { sw, sh, scene: makeTarget(sw, sh), bloom, sA: makeTarget(s1.w, s1.h), sB: makeTarget(s1.w, s1.h) };
  }

  function pass(prog, target, setup) {
    gl.useProgram(prog.p);
    if (target) { gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0, 0, target.w, target.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height); }
    setup(prog);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function tex(prog, name, t, unit) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.uniform1i(prog.u(name), unit);
  }

  /* =====================================================================
     CAMERA
     ===================================================================== */
  const cam = CONFIG.camera;
  const state = { paused: false, simTime: 0, last: performance.now(), frame: 0,
    fps: 0, fpsFrames: 0, fpsTime: 0, lowTime: 0, highTime: 0, tween: null, shot: false };

  const CAM_PRESETS = {
    film:  { dist: 22, pitch: 5,   fov: 55, yawDelta: 0 },
    edge:  { dist: 20, pitch: 0.6, fov: 50, yawDelta: 0 },
    top:   { dist: 26, pitch: 78,  fov: 55, yawDelta: 0 },
    close: { dist: 8,  pitch: 3,   fov: 60, yawDelta: 0.7, dur: 14 },
  };
  function setPreset(name) {
    const p = CAM_PRESETS[name];
    state.tween = { t: 0, dur: p.dur || 2.2,
      from: { dist: cam.dist, pitch: cam.pitch, yaw: cam.yaw, fov: cam.fov },
      to:   { dist: p.dist, pitch: p.pitch, yaw: cam.yaw + p.yawDelta, fov: p.fov } };
  }
  function resetCamera() { state.tween = null; Object.assign(cam, { dist: 22, yaw: 0.35, pitch: 5, fov: 55 }); syncUI(); }
  const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

  function cameraBasis() {
    const pr = cam.pitch * Math.PI / 180, yr = cam.yaw;
    const pos = [cam.dist * Math.cos(pr) * Math.sin(yr), cam.dist * Math.sin(pr), cam.dist * Math.cos(pr) * Math.cos(yr)];
    const len = Math.hypot(...pos);
    const f = pos.map((v) => -v / len);
    let r = [f[1] * 0 - f[2] * 1, f[2] * 0 - f[0] * 0, f[0] * 1 - f[1] * 0];    // f x worldUp(0,1,0)
    const rl = Math.hypot(...r) || 1; r = r.map((v) => v / rl);
    const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
    return { pos, f, r, u };
  }

  /* =====================================================================
     INPUT
     ===================================================================== */
  const pointers = new Map();
  let pinchStart = null;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('dragging');
    state.tween = null;
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: cam.dist }; }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1) {
      cam.yaw -= dx * 0.005;
      cam.pitch = Math.max(-89, Math.min(89, cam.pitch + dy * 0.25));
    } else if (pointers.size === 2 && pinchStart) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      cam.dist = clampDist(pinchStart.dist * pinchStart.d / Math.max(d, 1));
    }
  });
  const endPointer = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinchStart = null; if (!pointers.size) canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); state.tween = null; cam.dist = clampDist(cam.dist * Math.exp(e.deltaY * 0.001)); }, { passive: false });
  const clampDist = (d) => Math.max(cam.minDist, Math.min(cam.maxDist, d));

  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'SELECT') return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); state.paused = !state.paused; syncUI(); }
    else if (k === 'h') { $('#ui').classList.toggle('hidden'); $('#caption').classList.toggle('hidden'); $('#hint').classList.toggle('hidden'); }
    else if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); }
    else if (k === 'p') state.shot = true;
    else if (k === 'r') resetCamera();
    else if (k === '1') setPreset('film');
    else if (k === '2') setPreset('edge');
    else if (k === '3') setPreset('top');
    else if (k === '4') setPreset('close');
  });

  /* =====================================================================
     UI
     ===================================================================== */
  const Q = () => CONFIG.presets[CONFIG.quality];
  function applyQuality(name) { CONFIG.quality = name; CONFIG.renderScale = CONFIG.presets[name].scale; state.lowTime = state.highTime = 0; }
  const UI = [
    { sec: 'Quality' },
    { type: 'select', label: 'Preset', options: ['low', 'medium', 'high', 'ultra'], get: () => CONFIG.quality, set: applyQuality },
    { type: 'check', label: 'Adaptive resolution', obj: CONFIG, key: 'adaptive' },
    { sec: 'Accretion disk' },
    { type: 'range', label: 'Inner radius (rs)', obj: CONFIG.disk, key: 'rIn', min: 1.6, max: 6, step: 0.05 },
    { type: 'range', label: 'Outer radius (rs)', obj: CONFIG.disk, key: 'rOut', min: 6, max: 20, step: 0.1 },
    { type: 'range', label: 'Brightness', obj: CONFIG.disk, key: 'brightness', min: 0, max: 3, step: 0.01 },
    { type: 'range', label: 'Turbulence', obj: CONFIG.disk, key: 'turbulence', min: 0, max: 1, step: 0.01 },
    { type: 'range', label: 'Rotation speed', obj: CONFIG.disk, key: 'speed', min: 0, max: 4, step: 0.01 },
    { sec: 'Physics' },
    { type: 'check', label: 'Film mode (no Doppler)', obj: CONFIG.physics, key: 'film' },
    { type: 'check', label: 'Doppler beaming', obj: CONFIG.physics, key: 'doppler' },
    { type: 'check', label: 'Gravitational redshift', obj: CONFIG.physics, key: 'redshift' },
    { type: 'range', label: 'Spin (approx.)', obj: CONFIG.physics, key: 'spin', min: 0, max: 1, step: 0.01 },
    { sec: 'Post' },
    { type: 'range', label: 'Exposure', obj: CONFIG.post, key: 'exposure', min: 0.2, max: 3, step: 0.01 },
    { type: 'range', label: 'Bloom', obj: CONFIG.post, key: 'bloom', min: 0, max: 3, step: 0.01 },
    { type: 'range', label: 'Anamorphic streak', obj: CONFIG.post, key: 'streak', min: 0, max: 2, step: 0.01 },
    { type: 'range', label: 'Grain', obj: CONFIG.post, key: 'grain', min: 0, max: 1, step: 0.01 },
    { type: 'range', label: 'Stars', obj: CONFIG.sky, key: 'stars', min: 0, max: 3, step: 0.01 },
    { sec: 'Camera' },
    { type: 'range', label: 'FOV (deg)', obj: CONFIG.camera, key: 'fov', min: 25, max: 100, step: 0.5 },
    { type: 'check', label: 'Auto-orbit', obj: CONFIG.camera, key: 'autoOrbit' },
    { type: 'check', label: 'Pause time (Space)', get: () => state.paused, set: (v) => { state.paused = v; } },
    { type: 'buttons' },
  ];
  const syncers = [];
  function buildUI() {
    const body = $('#uiBody');
    for (const c of UI) {
      if (c.sec) { const d = document.createElement('div'); d.className = 'sec'; d.textContent = c.sec; body.appendChild(d); continue; }
      const get = c.get || (() => c.obj[c.key]);
      const set = c.set || ((v) => { c.obj[c.key] = v; });
      if (c.type === 'range') {
        const row = document.createElement('div'); row.className = 'row';
        const lab = document.createElement('label'); lab.textContent = c.label;
        const val = document.createElement('span'); val.className = 'val';
        const inp = document.createElement('input'); Object.assign(inp, { type: 'range', min: c.min, max: c.max, step: c.step });
        const dec = String(c.step).includes('.') ? String(c.step).split('.')[1].length : 0;
        const sync = () => { inp.value = get(); val.textContent = (+get()).toFixed(dec); };
        inp.addEventListener('input', () => { set(+inp.value); sync(); });
        inp.addEventListener('change', () => inp.blur());
        row.append(lab, val, inp); body.appendChild(row); syncers.push(sync);
      } else if (c.type === 'check') {
        const lab = document.createElement('label'); lab.className = 'check';
        const inp = document.createElement('input'); inp.type = 'checkbox';
        const sync = () => { inp.checked = !!get(); };
        inp.addEventListener('change', () => { set(inp.checked); inp.blur(); });
        lab.append(inp, document.createTextNode(c.label)); body.appendChild(lab); syncers.push(sync);
      } else if (c.type === 'select') {
        const row = document.createElement('div'); row.className = 'row';
        const lab = document.createElement('label'); lab.textContent = c.label;
        const sel = document.createElement('select');
        for (const o of c.options) { const op = document.createElement('option'); op.value = o; op.textContent = o[0].toUpperCase() + o.slice(1); sel.appendChild(op); }
        const sync = () => { sel.value = get(); };
        sel.addEventListener('change', () => { set(sel.value); sel.blur(); });
        row.append(lab, sel); body.appendChild(row); syncers.push(sync);
      } else if (c.type === 'buttons') {
        const box = document.createElement('div'); box.className = 'btns';
        const defs = [['1', 'Film', () => setPreset('film')], ['2', 'Edge-on', () => setPreset('edge')],
                      ['3', 'Top-down', () => setPreset('top')], ['4', 'Close approach', () => setPreset('close')],
                      ['R', 'Reset', resetCamera], ['P', 'Screenshot', () => { state.shot = true; }]];
        for (const [k, t, fn] of defs) {
          const b = document.createElement('button'); b.innerHTML = `<kbd>${k}</kbd>${t}`;
          b.addEventListener('click', () => { fn(); b.blur(); }); box.appendChild(b);
        }
        body.appendChild(box);
      }
    }
    const ro = document.createElement('div'); ro.id = 'readout';
    ro.innerHTML = 'FPS<b id="rFps">-</b>Resolution<b id="rRes">-</b>Max steps<b id="rSteps">-</b>Distance<b id="rDist">-</b>Buffer<b id="rFmt">-</b>';
    body.appendChild(ro);
    const keys = document.createElement('div'); keys.className = 'keys';
    keys.textContent = 'Space pause · H hide UI · F fullscreen · P screenshot · R reset';
    body.appendChild(keys);
    $('#uiHeader').addEventListener('click', () => $('#ui').classList.toggle('collapsed'));
    if (innerWidth < 640) $('#ui').classList.add('collapsed');
    syncUI();
  }
  function syncUI() { syncers.forEach((s) => s()); }
  buildUI();

  /* =====================================================================
     RENDER LOOP
     ===================================================================== */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDPR);
    const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }

  function updateStats(dt) {
    state.fpsFrames++; state.fpsTime += dt;
    if (state.fpsTime < 0.5) return;
    state.fps = state.fpsFrames / state.fpsTime;
    if (CONFIG.adaptive) {
      if (state.fps < 30) state.lowTime += state.fpsTime; else state.lowTime = 0;
      if (state.fps > 55) state.highTime += state.fpsTime; else state.highTime = 0;
      if (state.lowTime >= 2 && CONFIG.renderScale > CONFIG.minScale) {
        CONFIG.renderScale = Math.max(CONFIG.minScale, +(CONFIG.renderScale - 0.1).toFixed(2)); state.lowTime = 0;
      } else if (state.highTime >= 2 && CONFIG.renderScale < Q().scale) {
        CONFIG.renderScale = Math.min(Q().scale, +(CONFIG.renderScale + 0.1).toFixed(2)); state.highTime = 0;
      }
    }
    $('#rFps').textContent = state.fps.toFixed(1);
    $('#rRes').textContent = T ? `${T.sw}x${T.sh} (${Math.round(CONFIG.renderScale * 100)}%)` : '-';
    $('#rSteps').textContent = Q().steps;
    $('#rDist').textContent = cam.dist.toFixed(1) + ' rs';
    $('#rFmt').textContent = FMT.name;
    state.fpsFrames = 0; state.fpsTime = 0;
  }

  function frame(now) {
    if (state.halt) return;   // debugging hook: stops the loop
    const dt = Math.min(0.1, Math.max(0, (now - state.last) / 1000));
    state.last = now;
    if (!state.paused) state.simTime += dt * CONFIG.timeScale * CONFIG.disk.speed;
    state.frame = (state.frame + 1) >>> 0;

    // camera animation
    if (state.tween) {
      const tw = state.tween; tw.t += dt;
      const k = ease(Math.min(1, tw.t / tw.dur));
      for (const key of ['dist', 'pitch', 'yaw', 'fov']) cam[key] = tw.from[key] + (tw.to[key] - tw.from[key]) * k;
      if (tw.t >= tw.dur) state.tween = null;
    }
    if (cam.autoOrbit && !state.paused && pointers.size === 0) cam.yaw += cam.orbitSpeed * dt;

    resize();
    const sw = Math.max(8, Math.round(canvas.width * CONFIG.renderScale));
    const sh = Math.max(8, Math.round(canvas.height * CONFIG.renderScale));
    buildTargets(sw, sh);

    const b = cameraBasis();
    const q = Q();
    const tanHalf = Math.tan(cam.fov * Math.PI / 360);
    const enc = FMT.enc, dec = 1 / FMT.enc;

    // 1) ray-traced scene (HDR)
    pass(P.scene, T.scene, (p) => {
      gl.uniform2f(p.u('uRes'), sw, sh);
      gl.uniform3fv(p.u('uCamPos'), b.pos); gl.uniform3fv(p.u('uCamFwd'), b.f);
      gl.uniform3fv(p.u('uCamRight'), b.r); gl.uniform3fv(p.u('uCamUp'), b.u);
      gl.uniform1f(p.u('uTanHalf'), tanHalf);
      gl.uniform1f(p.u('uPixAngle'), 2 * tanHalf / sh);
      gl.uniform1f(p.u('uTime'), state.simTime);
      gl.uniform1i(p.u('uMaxSteps'), q.steps);
      gl.uniform1i(p.u('uOct'), q.octaves);
      gl.uniform1f(p.u('uStepK'), q.stepK);
      gl.uniform1f(p.u('uEscape'), Math.max(CONFIG.sky.escape, cam.dist + 5));
      const d = CONFIG.disk;
      gl.uniform1f(p.u('uRin'), Math.min(d.rIn, d.rOut - 0.5));
      gl.uniform1f(p.u('uRout'), d.rOut);
      gl.uniform1f(p.u('uDiskBright'), d.brightness);
      gl.uniform1f(p.u('uTurb'), d.turbulence);
      gl.uniform1f(p.u('uOpacity'), d.opacity);
      gl.uniform1f(p.u('uFlowPeriod'), CONFIG.flowPeriod);
      const ph = CONFIG.physics;
      gl.uniform1f(p.u('uFilm'), ph.film ? 1 : 0);
      gl.uniform1f(p.u('uDoppler'), ph.doppler ? 1 : 0);
      gl.uniform1f(p.u('uRedshift'), ph.redshift ? 1 : 0);
      gl.uniform1f(p.u('uSpin'), ph.spin);
      gl.uniform1f(p.u('uStars'), CONFIG.sky.stars);
      gl.uniform1f(p.u('uEnc'), enc);
    });

    // 2) bright pass -> bloom level 0
    const L = T.bloom;
    pass(P.bright, L[0].a, (p) => {
      tex(p, 'uTex', T.scene.tex, 0);
      gl.uniform1f(p.u('uThr'), CONFIG.post.threshold);
      gl.uniform1f(p.u('uDec'), dec); gl.uniform1f(p.u('uEnc'), enc);
    });
    // 3) bloom mip chain with separable blur
    const blur = (lvl) => {
      pass(P.blur, lvl.b, (p) => { tex(p, 'uTex', lvl.a.tex, 0); gl.uniform2f(p.u('uTexel'), 1 / lvl.a.w, 1 / lvl.a.h); gl.uniform2f(p.u('uDir'), 1, 0); });
      pass(P.blur, lvl.a, (p) => { tex(p, 'uTex', lvl.b.tex, 0); gl.uniform2f(p.u('uTexel'), 1 / lvl.b.w, 1 / lvl.b.h); gl.uniform2f(p.u('uDir'), 0, 1); });
    };
    blur(L[0]);
    for (let i = 1; i < L.length; i++) {
      pass(P.down, L[i].a, (p) => { tex(p, 'uTex', L[i - 1].a.tex, 0); gl.uniform2f(p.u('uTexel'), 0.5 / L[i - 1].a.w, 0.5 / L[i - 1].a.h); });
      blur(L[i]);
    }
    // 4) anamorphic streak from bloom level 1
    if (CONFIG.post.streak > 0) {
      const strides = [1, 4, 14];
      let src = L[1].a, dst = T.sA;
      for (let i = 0; i < strides.length; i++) {
        pass(P.streak, dst, (p) => { tex(p, 'uTex', src.tex, 0); gl.uniform2f(p.u('uTexel'), 1 / src.w, 1 / src.h); gl.uniform1f(p.u('uStride'), strides[i]); });
        src = dst; dst = dst === T.sA ? T.sB : T.sA;
      }
      T.streakOut = src;
    } else T.streakOut = L[3].b;   // unused (amount 0), any valid texture

    // 5) composite + tone map to screen
    pass(P.composite, null, (p) => {
      tex(p, 'uScene', T.scene.tex, 0);
      tex(p, 'uB0', L[0].a.tex, 1); tex(p, 'uB1', L[1].a.tex, 2);
      tex(p, 'uB2', L[2].a.tex, 3); tex(p, 'uB3', L[3].a.tex, 4);
      tex(p, 'uStreak', T.streakOut.tex, 5);
      const po = CONFIG.post;
      gl.uniform1f(p.u('uExposure'), po.exposure); gl.uniform1f(p.u('uBloom'), po.bloom);
      gl.uniform1f(p.u('uStreakAmt'), po.streak); gl.uniform1f(p.u('uGrain'), po.grain);
      gl.uniform1f(p.u('uVig'), po.vignette); gl.uniform1f(p.u('uDec'), dec);
      gl.uniform2f(p.u('uRes'), canvas.width, canvas.height);
      gl.uniform1ui(p.u('uFrame'), state.paused ? 0 : state.frame);
    });

    // screenshot in the same task as the draw (no preserveDrawingBuffer needed)
    if (state.shot) {
      state.shot = false;
      canvas.toBlob((blob) => {
        if (!blob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `gargantua-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }, 'image/png');
    }

    if (state.captureCb) { const cb = state.captureCb; state.captureCb = null; cb(canvas.toDataURL('image/png')); }   // test hook
    updateStats(dt);
    requestAnimationFrame(frame);
  }

  window.__gargantua = { CONFIG, state, cam, setPreset, fmt: FMT.name };   // debugging hook
  requestAnimationFrame(frame);
}

try { main(); } catch (e) { showError(String(e && e.message || e)); }
</script>
