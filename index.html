<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interstellia: Menu Utama</title>
<style>
  /* Menu utama infografis (dari prototipe docs/app/menu-infografis-v3.html, konsep docs/app/konsep-menu-infografis.md).
     Foto menu = experiences/<id>/menu.webp (diolah tools/poles_foto_menu.py). Tanpa library, jalan dari file://. */
  :root { --ink: #e8ecf2; --muted: #9aa2ae; --line: rgba(255,255,255,0.12); --glass: rgba(10,12,18,0.66);
    --cu: #d9bd62; --ga: #f3a55a; --mi: #8fd3dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
  /* latar: gradasi hangat statis (dulu digambar canvas bintang; bintang dihapus karena terlihat seperti debu di layar) */
  body { background: radial-gradient(circle 80vmax at 75% 20%, #1a1410 0%, #07080c 40%, #000 100%) fixed; }
  .lang { position: fixed; top: 14px; right: 14px; display: flex; gap: 6px; z-index: 30; }
  .lang button { font: inherit; font-size: 12px; color: var(--ink); background: rgba(8,10,14,0.8); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; cursor: pointer; backdrop-filter: blur(6px); }
  .lang button.on { border-color: rgba(243,165,90,0.8); color: #fff; }
  .dots { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 30; display: flex; flex-direction: column; gap: 14px; }
  .dots a { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.5); display: block; transition: all .3s; }
  .dots a.on { background: var(--c, #fff); border-color: var(--c, #fff); transform: scale(1.35); box-shadow: 0 0 12px var(--c, #fff); }

  /* ===== hero ===== */
  .hero { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 60px 16px 40px; overflow: hidden; }
  /* latar hero: foto menutupi layar penuh, berganti saat lingkaran menu disorot (bawaan Copper) */
  .hbg { position: absolute !important; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity .8s ease;
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 25%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 50%, #000 25%, transparent 75%); }
  .hbg.on { opacity: 0.26; }
  /* Gargantua: bagian bawah foto, wahana di atas deretan lingkaran */
  .hbg[data-bg=gargantua] { background-position: center 100%; }
  .hero > * { position: relative; }
  .hero h1 { margin: 0; font-weight: 200; letter-spacing: 0.45em; margin-right: -0.45em; text-transform: uppercase; font-size: clamp(32px, 9vw, 92px);
    background: linear-gradient(90deg, #f3e2b0, #fff 40%, #ffd3a0 60%, #cfeef2); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 30px rgba(255,200,140,0.25)); }
  .hero .tag { margin: 10px 0 30px; color: #b5bcc6; letter-spacing: 0.14em; font-size: clamp(13px, 2vw, 16px); }
  .route { width: min(980px, 100%); height: auto; overflow: visible; }
  .route a { cursor: pointer; outline: none; }
  .route .halo { opacity: 0.35; transition: opacity .3s; }
  .route a:hover .halo, .route a:focus .halo { opacity: 0.9; }
  .route a .pl { transition: transform .4s; transform-box: fill-box; transform-origin: center; }
  .route a:hover .pl { transform: scale(1.07); }
  .route text { font-size: 13px; fill: var(--ink); text-anchor: middle; letter-spacing: 0.12em; font-weight: 600; }
  .route text.sub { font-size: 11px; fill: var(--muted); letter-spacing: 0.04em; font-weight: 400; }
  .chev { margin-top: 26px; color: var(--muted); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; animation: bob 2.2s ease-in-out infinite; }
  .chev::after { content: ''; display: block; width: 12px; height: 12px; margin: 8px auto 0; border-right: 1.5px solid; border-bottom: 1.5px solid; transform: rotate(45deg); }
  @keyframes bob { 50% { transform: translateY(8px); } }

  /* ===== bagian experience ===== */
  section.xp { position: relative; z-index: 1; overflow: hidden; padding: 90px 0 70px; border-top: 1px solid rgba(255,255,255,0.06); }
  .xp .bg { position: absolute; inset: -10%; background: #05060a center / cover no-repeat; opacity: 0.32; filter: blur(34px) saturate(1.2); will-change: transform; }
  .xp .shade { position: absolute; inset: 0; background: linear-gradient(180deg, #000 0%, rgba(0,0,0,0.55) 20%, rgba(0,0,0,0.6) 80%, #000 100%); }
  .wrap { position: relative; max-width: 1200px; width: 100%; margin: 0 auto; padding: 0 28px; }
  .head { display: grid; grid-template-columns: auto 1fr; gap: 6px 28px; align-items: end; }
  .no { color: var(--a); font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 600; }
  .no b { font-size: 64px; font-weight: 200; letter-spacing: 0; display: block; line-height: 0.9; opacity: 0.6; }
  .xp h2 { margin: 0; font-size: clamp(30px, 5vw, 56px); font-weight: 700; line-height: 1.05; letter-spacing: -0.01em; }
  .xp .hook { margin: 6px 0 0; font-size: clamp(17px, 2vw, 21px); color: #fff; font-weight: 300; }
  .xp .lead { margin: 14px 0 0; color: #bcc3cd; max-width: 70ch; }

  /* foto beranotasi */
  .photo { position: relative; margin-top: 26px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 40px 100px rgba(0,0,0,0.6); background: #000; }
  .photo img { display: block; width: 100%; height: auto; transform: scale(1.04); transition: transform 2.4s cubic-bezier(.2,.7,.2,1); }
  .photo.in img { transform: none; }
  .photo::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0.25), transparent 25%, transparent 70%, rgba(0,0,0,0.45)); }
  .photo svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .ov text { font: 600 22px system-ui, sans-serif; fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,0.65); stroke-width: 5px; }
  .ov .thin { font-weight: 400; font-size: 18px; }
  .spot { position: absolute; z-index: 2; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.55);
    color: #fff; font: 700 13px/26px system-ui, sans-serif; text-align: center; cursor: pointer; padding: 0; backdrop-filter: blur(4px);
    opacity: 0; transform: scale(0.4); transition: opacity .5s, transform .5s cubic-bezier(.3,1.6,.5,1), background .2s; transition-delay: var(--d, 0s); }
  .in .spot { opacity: 1; transform: none; }
  .spot::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--a); opacity: 0; animation: ping 2.4s ease-out infinite; animation-delay: var(--d, 0s); }
  @keyframes ping { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }
  .spot.on { background: var(--a); color: #111; border-color: var(--a); }
  .spot .lab { position: absolute; top: 50%; left: 38px; transform: translateY(-50%); white-space: nowrap; font: 600 12.5px/1 system-ui, sans-serif; letter-spacing: 0.02em;
    padding: 6px 10px; border-radius: 99px; background: rgba(6,8,12,0.78); color: #fff; border: 1px solid rgba(255,255,255,0.18); pointer-events: none; }
  .spot .lab::before { content: ''; position: absolute; top: 50%; right: 100%; width: 8px; height: 1.5px; background: rgba(255,255,255,0.6); }
  .spot.l .lab { left: auto; right: 38px; }
  .spot.l .lab::before { right: auto; left: 100%; }
  .spot.on .lab { background: var(--a); color: #111; border-color: var(--a); }
  .card { position: absolute; z-index: 3; left: 18px; bottom: 18px; width: min(400px, calc(100% - 36px)); padding: 14px 16px 14px 56px; border-radius: 14px;
    background: rgba(6,8,12,0.82); border: 1px solid var(--line); border-left: 3px solid var(--a); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .card i { position: absolute; left: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; background: var(--a); color: #111; font: 700 14px/30px system-ui; text-align: center; font-style: normal; }
  .card b { display: block; font-size: 15px; color: #fff; }
  .card span { font-size: 13px; color: #c8ced7; }
  .card.r { left: auto; right: 18px; }
  .card.tr { left: auto; right: 18px; top: 18px; bottom: auto; }
  .imgbox { position: relative; }
  .card.fade { animation: cardIn .45s ease; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } }

  /* bawah foto */
  .below { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; align-items: start; }
  .below.one { grid-template-columns: 1fr; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .below.one .stats { grid-template-columns: repeat(4, 1fr); }
  .stat { padding: 12px 14px; border-left: 2px solid var(--a); background: linear-gradient(90deg, color-mix(in srgb, var(--a) 13%, transparent), transparent); border-radius: 0 10px 10px 0; }
  .stat b { display: block; font-size: clamp(22px, 3vw, 30px); font-weight: 650; color: #fff; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat span { font-size: 12px; color: var(--muted); }
  .go { position: absolute; z-index: 4; top: 16px; left: 16px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); display: inline-flex; align-items: center; gap: 10px; background: var(--a); color: #0b0b0b; font-weight: 700; text-decoration: none;
    padding: 12px 26px; border-radius: 99px; letter-spacing: 0.05em; transition: transform .2s, box-shadow .3s; }
  .go:hover, .go:focus-visible { transform: scale(1.05); box-shadow: 0 8px 34px color-mix(in srgb, var(--a) 55%, transparent); outline: none; }
  .go svg { width: 16px; height: 16px; }
  .calc { padding: 14px 16px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .calc label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .calc label b { color: var(--a); font-variant-numeric: tabular-nums; }
  .calc input[type=range] { width: 100%; margin: 10px 0 6px; accent-color: var(--a); }
  .out { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .out div { font-size: 11.5px; color: var(--muted); }
  .out b { display: block; font-size: 16px; color: #fff; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; margin-left: 6px; font-size: 10.5px; padding: 1px 8px; border-radius: 99px; background: var(--a); color: #111; font-weight: 700; vertical-align: 2px; }
  .badge[hidden] { display: none; }
  .note { margin-top: 6px; font-size: 11px; color: var(--muted); }
  .clk .hand { animation: spin 60s linear infinite; }
  .clk .hand.fast { animation-duration: 0.9s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 30px; }
  .feat { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: rgba(10,12,18,0.55); border: 1px solid var(--line);
    backdrop-filter: blur(6px); transition: border-color .25s, transform .25s; }
  .feat:hover { border-color: color-mix(in srgb, var(--a) 60%, transparent); transform: translateY(-2px); }
  .feat .ic { flex: 0 0 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: var(--a);
    background: color-mix(in srgb, var(--a) 14%, transparent); border: 1px solid color-mix(in srgb, var(--a) 30%, transparent); }
  .feat .ic svg { width: 22px; height: 22px; }
  .feat b { display: block; font-size: 14px; }
  .feat span { display: block; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .keys { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
  kbd { display: inline-block; min-width: 24px; text-align: center; padding: 1px 6px; margin-right: 5px; border-radius: 5px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.25); border-bottom-width: 2px; color: var(--ink); font: 600 11px/1.6 ui-monospace, monospace; }

  .soon { position: relative; z-index: 1; max-width: 1200px; margin: 50px auto 0; padding: 0 28px; }
  .soon > div { display: flex; margin-top: 10px; gap: 16px; align-items: center; padding: 20px 24px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); background: rgba(10,12,18,0.5); }
  .soon svg { width: 34px; height: 34px; color: #cfd6df; flex: none; }
  .soon b { color: var(--ink); }
  .gh { position: fixed; top: 14px; left: 14px; z-index: 30; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); text-decoration: none;
    background: rgba(8,10,14,0.8); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; backdrop-filter: blur(6px); }
  .gh:hover { border-color: rgba(255,255,255,0.4); }
  .gh svg, .credit svg { width: 15px; height: 15px; }
  .credit { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-top: 8px; }
  .credit a { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
  footer { position: relative; z-index: 1; max-width: 1200px; margin: 40px auto 0; padding: 14px 28px 40px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

  .rv { opacity: 0; transform: translateY(28px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0s); }
  .rv.in { opacity: 1; transform: none; }
  .ov .draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.6s ease; transition-delay: var(--d, .6s); }
  .in .ov .draw { stroke-dashoffset: 0; }
  .ov .lbl { opacity: 0; transition: opacity .8s; transition-delay: var(--d, 1.4s); }
  .in .ov .lbl { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rv, .spot { opacity: 1; transform: none; } .ov .draw { stroke-dashoffset: 0; } .ov .lbl { opacity: 1; } .photo img { transform: none; } html { scroll-behavior: auto; }
  }
  @media (max-width: 860px) {
    .below, .below.one { grid-template-columns: 1fr; }
    .below.one .stats { grid-template-columns: repeat(2, 1fr); }
    .feats { grid-template-columns: 1fr 1fr; }
    .dots { display: none; }
    .wrap, .soon { padding: 0 16px; }
    .spot .lab { display: none; }
    .spot { width: 26px; height: 26px; margin: -13px 0 0 -13px; line-height: 22px; font-size: 12px; }
    .card, .card.r { position: static; width: auto; margin: 0; border-radius: 0 0 14px 14px; border: 0; border-top: 1px solid var(--line); border-left: 3px solid var(--a); }
    .photo { overflow: visible; }
    .photo .imgbox { border-radius: 18px 18px 0 0; overflow: hidden; }
  }
  @media (max-width: 520px) { .feats { grid-template-columns: 1fr; } .head { grid-template-columns: 1fr; } .no b { font-size: 44px; } }
</style>
</head>
<body>
<div class="lang" id="lang"></div>
<a class="gh" href="https://github.com/bhaktiutama/interstellia" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a>
<nav class="dots" aria-label="Navigasi">
  <a href="#top" style="--c:#fff" aria-label="Interstellia"></a>
  <a href="#cooper-station" style="--c:var(--cu)" aria-label="Copper Corn Station"></a>
  <a href="#gargantua" style="--c:var(--ga)" aria-label="Gargantua"></a>
  <a href="#millar" style="--c:var(--mi)" aria-label="Millar's World"></a>
</nav>

<!-- ================= HERO: tiga dunia dari foto in-game ================= -->
<header class="hero" id="top">
  <div class="hbg on" data-bg="cooper-station" style="background-image:url('experiences/cooper-station/menu.webp')"></div>
  <div class="hbg" data-bg="gargantua" style="background-image:url('experiences/gargantua/menu.webp')"></div>
  <div class="hbg" data-bg="millar" style="background-image:url('experiences/millar/menu.webp')"></div>
  <h1 class="rv">Interstellia</h1>
  <p class="tag rv" style="--d:.2s" id="tagline"></p>
  <svg class="route rv" style="--d:.4s" viewBox="0 0 900 230" role="img" aria-label="Peta perjalanan">
    <defs>
      <clipPath id="c1"><circle cx="150" cy="110" r="46"/></clipPath>
      <clipPath id="c2"><circle cx="450" cy="110" r="46"/></clipPath>
      <clipPath id="c3"><circle cx="750" cy="110" r="46"/></clipPath>
      <filter id="hBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
      <filter id="hGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path id="routeP" d="M150 110 C 290 20, 350 200, 450 110 S 620 20, 750 110" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 7"/>
    <g filter="url(#hGlow)"><path d="M-6 -3 L7 0 L-6 3 L-3 0 Z" fill="#fff"/>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#routeP"/></animateMotion></g>
    <a href="#cooper-station" aria-label="Copper Corn Station">
      <circle class="halo" cx="150" cy="110" r="62" fill="var(--cu)" filter="url(#hBlur)"/>
      <g class="pl"><image href="experiences/cooper-station/menu.webp" x="47" y="41" width="203" height="141" clip-path="url(#c1)"/>
        <circle cx="150" cy="110" r="46" fill="none" stroke="var(--cu)" stroke-width="2"/></g>
      <text x="150" y="186">COPPER CORN STATION</text><text class="sub" x="150" y="204" data-t="r1"></text>
    </a>
    <a href="#gargantua" aria-label="Gargantua">
      <circle class="halo" cx="450" cy="110" r="66" fill="var(--ga)" filter="url(#hBlur)"/>
      <g class="pl"><image href="experiences/gargantua/menu.webp" x="412" y="66" width="171" height="131" clip-path="url(#c2)"/>
        <circle cx="450" cy="110" r="46" fill="none" stroke="var(--ga)" stroke-width="2"/></g>
      <text x="450" y="186">GARGANTUA</text><text class="sub" x="450" y="204" data-t="r2"></text>
    </a>
    <a href="#millar" aria-label="Millar's World">
      <circle class="halo" cx="750" cy="110" r="62" fill="var(--mi)" filter="url(#hBlur)"/>
      <g class="pl"><image href="experiences/millar/menu.webp" x="670" y="54" width="205" height="125" clip-path="url(#c3)"/>
        <circle cx="750" cy="110" r="46" fill="none" stroke="var(--mi)" stroke-width="2"/></g>
      <text x="750" y="186">MILLAR'S WORLD</text><text class="sub" x="750" y="204" data-t="r3"></text>
    </a>
  </svg>
  <div class="chev" data-t="scroll"></div>
</header>

<!-- ================= COPPER CORN STATION ================= -->
<section class="xp" id="cooper-station" style="--a: var(--cu)">
  <div class="bg" style="background-image:url('experiences/cooper-station/menu.webp')"></div><div class="shade"></div>
  <div class="wrap">
    <div class="head rv"><div class="no"><b>01</b><span data-t="c_kind"></span></div>
      <div><h2>Copper Corn Station</h2><p class="hook" data-t="c_hook"></p></div></div>
    <p class="lead rv" data-t="c_lead"></p>
    <div class="photo rv" data-p="c">
      <div class="imgbox"><a class="go" data-x="cooper-station"><span data-t="play"></span><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg></a><img src="experiences/cooper-station/menu.webp" width="1202" height="835" alt="Copper Corn Station dari dalam silinder">
      <!-- "bawah" mengarah menjauhi sumbu: panah radial dari pusat end cap -->
      <svg class="ov" viewBox="0 0 1202 835" preserveAspectRatio="none">
        <defs><marker id="oA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>
        <circle class="draw" pathLength="1" cx="610" cy="410" r="215" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.7" style="--d:.4s"/>
        <g stroke="#fff" stroke-width="3" fill="none" marker-end="url(#oA)" opacity="0.9">
          <path class="draw" pathLength="1" d="M796 518 L 900 578"/><path class="draw" pathLength="1" d="M424 518 L 320 578"/>
          <path class="draw" pathLength="1" d="M796 302 L 900 242"/><path class="draw" pathLength="1" d="M610 625 L 610 735"/>
        </g>
      </svg></div>
      <div class="card tr" aria-live="polite"></div>

    radar: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6.4-6.4"/><circle cx="15.5" cy="15" r="1.2" fill="currentColor"/>',
    wave: '<path d="M2 19c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/><path d="M3 14c4-1 5-10 11-10 3 0 5 2 5 4-2-1-5 0-5 3 0 2 2 3 4 3"/>',
    ship: '<path d="M2 13l9-2 3-6h2l-1 6 7 1v2l-7 1 1 6h-2l-3-6-9-2z"/>',
    orbit: '<circle cx="12" cy="12" r="4.5"/><ellipse cx="12" cy="12" rx="10.5" ry="4" transform="rotate(-20 12 12)"/>',
    suit: '<circle cx="12" cy="7" r="5"/><path d="M9 7h6"/><path d="M5 22v-3a7 7 0 0114 0v3"/>',
    phones: '<path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/>',
  };
  const FEATS = {
    c: [['tram', 'Trem dan lalu lintas', 'Tram and traffic', 'Trem berinterior keliling kota, mobil antre di lampu merah, orang menyeberang di zebra', 'Trams with full interiors circle the city, cars queue at red lights, people cross at zebras'],
        ['lift', 'Lift ke sumbu nol-g', 'Lift to the zero-g axis', 'Naik lift 1 km ke hub di sumbu, gravitasi memudar sampai kamu melayang bebas', 'Ride the lift 1 km up to the axis hub as gravity slowly fades away until you float freely'],
        ['rocket', 'Shuttle KS-07', 'KS-07 shuttle', 'Lewat terminal ke dermaga, terbangkan shuttle di luar stasiun, lalu sandar sendiri', 'Walk through the terminal to the dock, fly outside the station, then berth it yourself'],
        ['bike', 'Motor 150 km/h', '150 km/h motorbike', 'Café racer V-twin: terasa lebih berat searah putaran, lebih ringan saat melawannya', 'A V-twin café racer; you feel heavier riding with the spin and lighter riding against it'],
        ['cloud', 'Cuaca dan Coriolis', 'Weather and Coriolis', 'Awan dan hujan dinamis; hujan miring 8 derajat, air mancur berbelok karena Coriolis', 'Dynamic clouds and rain; rain slants 8 degrees and the fountain curves from Coriolis'],
        ['eclipse', 'Gerhana Saturnus', 'Saturn eclipse', 'Tiap orbit Saturnus menutup Matahari 2,78 jam: sunline padam, tepi atmosfer menyala', 'Every orbit Saturn hides the Sun for 2.78 h: the sunline fades, the limb glows']],
    g: [['fall', 'Jatuh ke horizon', 'Fall to the horizon', 'Jatuh lurus dari kamera luar atau kokpit 3 layar, dorongan dengan anggaran delta-v', 'Fall straight in from the chase view or 3-screen cockpit on a limited delta-v budget'],
        ['flame', 'Susur piringan', 'Skim the disk', 'Autopilot rendah sampai ISCO, gas melesat 0,8 c, bara dan debu menghantam kaca', 'Autopilot skims low to the ISCO, gas rushes by at 0.8 c, embers hit the glass'],
        ['antenna', 'Relai sinyal', 'Signal relay', 'Kirim suar ke relai 22 rs; diagram ruang-waktu menunjukkan jam wahana membeku', 'Fire flares to the 22 rs relay; a spacetime diagram shows why the craft clock freezes'],
        ['cube', 'Gerbang tesseract (fiksi)', 'Tesseract gate (fiction)', 'Bekukan waktu, bidik sudut masuk 24,62 derajat, lalu terbang ke gerbang hiperkubus', 'Freeze time, aim the entry angle at 24.62 degrees, then fly to the hypercube gate'],
        ['sound', 'Suara disintesis', 'Synthesized sound', 'Gemuruh piringan, derit pasang surut, pendorong, bip relai, semua disintesis', 'Disk roar, creaking tidal strain, thrusters and relay beeps, all generated live in the browser'],
        ['camera', 'Kamera rangefinder', 'Rangefinder camera', 'Lensa 21-90 mm, aperture, rana, ISO; bidik lewat jendela rangefinder, simpan foto atau video lensa gravitasi', 'Lenses from 21 to 90 mm, aperture, shutter and ISO; frame through a rangefinder, save photos or video of the lensing']],
    m: [['radar', 'Misi radar', 'Radar mission', 'Cari 3 pecahan wahana dengan radar, lalu tempuh rute tercepat sebelum gelombang', 'Find 3 wreck pieces with radar pings and run the fastest route before the wave hits'],
        ['wave', 'Laut hidup', 'Living ocean', 'Ombak FFT dengan buih dan kaustik, riak di kaki, arus surut yang menyeret', 'FFT waves with foam and caustics, ripples at your feet, a backwash that drags at you'],
        ['ship', 'Terbangkan KS-07', 'Fly the KS-07', 'Naik ke kokpit 3 layar, lepas landas dari air, dan lolos melewati puncak gelombang', 'Climb into the 3-screen cockpit, lift off from the water and fly clear over the wave crest'],
        ['orbit', 'Orbit dan sinematik', 'Orbit and cinematics', 'Turun dari orbit ke permukaan laut, lalu pergi lagi menembus plasma masuk atmosfer', 'Descend from orbit to the ocean surface, then leave again through reentry plasma'],
        ['suit', 'Tubuh astronaut', 'Astronaut body', 'Kaki dan sarung tanganmu terlihat, pakaian ikut basah, visor helm berembun dan berair', 'See your own legs and gloves, a suit that gets wet, a visor with fog and water drops'],
        ['phones', 'Suara laut', 'Ocean sound', 'Angin, ombak, napas di dalam helm, dan gemuruh gelombang raksasa mendekat', 'Wind, surf, your breath inside the helmet and the rumble of the giant wave drawing near']],
  };
  const KEYS = {
    c: [['WASD', 'jalan', 'walk'], ['E', 'aksi', 'action'], ['M', 'peta', 'map'], ['C', 'motor', 'bike'], ['8', 'kokpit', 'cockpit'], ['F', 'kamera', 'camera']],
    g: [['V', 'wahana', 'craft'], ['O', 'autopilot', 'autopilot'], ['E', 'suar', 'flare'], ['M', 'relai', 'relay'], ['F', 'kamera', 'camera']],
    m: [['WASD', 'jalan', 'walk'], ['M', 'radar', 'radar'], ['E', 'ambil / naik', 'pick up / board'], ['V', 'kamera', 'camera'], ['U', 'suara', 'sound']],
  };

  const LANGS = [['id', 'Bahasa Indonesia'], ['en', 'English']];
  let LANG = 'id';
  {
    const ok = (c) => LANGS.some((x) => x[0] === c); let c = null;
    try { c = new URLSearchParams(location.search).get('lang'); } catch (e) { /* abaikan */ }
    if (!ok(c)) try { c = localStorage.getItem('lazarus.lang'); } catch (e) { c = null; }
    if (!ok(c)) c = (navigator.language || 'id').slice(0, 2).toLowerCase();
    LANG = ok(c) ? c : 'id';
  }
  const T = (k) => TXT[LANG][k];
  const tr = (o, k) => (LANG !== 'id' && o[LANG] && o[LANG][k] !== undefined ? o[LANG][k] : o[k]);
  const fmt = (n, d) => n.toLocaleString(LANG === 'id' ? 'id-ID' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- penanda foto: hover / klik memilih; berganti sendiri tiap 5 s sampai pengguna menyentuh ----
  const PH = {};
  for (const p of document.querySelectorAll('.photo[data-p]')) {
    const key = p.dataset.p, S = SPOTS[key];
    PH[key] = { el: p, sel: 0, user: false, vis: false };
    const box = p.querySelector('.imgbox');
    S.list.forEach((s, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'spot' + (s.l ? ' l' : '');
      b.style.left = (s.x / S.w * 100) + '%'; b.style.top = (s.y / S.h * 100) + '%'; b.style.setProperty('--d', (0.5 + i * 0.12) + 's');
      b.innerHTML = `${i + 1}<span class="lab"></span>`;
      const pick = (u) => { if (u) PH[key].user = true; selSpot(key, i); };
      b.addEventListener('mouseenter', () => pick(true)); b.addEventListener('click', () => pick(true)); b.addEventListener('focus', () => pick(true));
      box.appendChild(b);
    });
  }
  function selSpot(key, i) {
    const P = PH[key], s = SPOTS[key].list[i], tx = LANG === 'en' ? s.en : s.id;
    P.sel = i;
    P.el.querySelectorAll('.spot').forEach((b, j) => b.classList.toggle('on', j === i));
    const c = P.el.querySelector('.card');
    c.innerHTML = '<i></i><b></b><span></span>'; c.querySelector('i').textContent = i + 1;
    c.querySelector('b').textContent = tx[0]; c.querySelector('span').textContent = tx[1];
    c.classList.remove('fade'); void c.offsetWidth; c.classList.add('fade');
  }
  if (!reduce) setInterval(() => {
    for (const k in PH) { const P = PH[k]; if (P.vis && !P.user) selSpot(k, (P.sel + 1) % SPOTS[k].list.length); }
  }, 5000);

  // ---- angka menghitung naik ----
  const counted = new Set();
  const statText = (st, f) => fmt(st.v * f, st.d) + st.s;
  function countUp(box) {
    if (counted.has(box)) return; counted.add(box);
    const list = STATS[box.dataset.s], bs = box.querySelectorAll('b');
    if (reduce) { list.forEach((st, i) => { bs[i].textContent = statText(st, 1); }); return; }
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 1400), e = 1 - Math.pow(1 - k, 3);
      list.forEach((st, i) => { bs[i].textContent = statText(st, e); });
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ---- Copper: radius -> putaran untuk 1 g (T = 2 pi akar(R/g), v = akar(gR)) ----
  const G0 = 9.81, cRange = document.getElementById('cRange');
  const rOf = (x) => { const r = 50 * Math.pow(200, x / 1000); return r < 1000 ? Math.round(r / 10) * 10 : Math.round(r / 50) * 50; };
  cRange.value = Math.round(1000 * Math.log(1000 / 50) / Math.log(200));
  function updCopper() {
    const R = rOf(+cRange.value), per = 2 * Math.PI * Math.sqrt(R / G0), v = Math.sqrt(G0 * R);
    document.getElementById('cR').textContent = fmt(R, 0) + ' m';
    document.getElementById('cBadge').hidden = R !== 1000;
    document.getElementById('cT').textContent = per < 120 ? fmt(per, 1) + ' s' : fmt(per / 60, 1) + ' ' + T('mn');
    document.getElementById('cRpm').textContent = fmt(60 / per, 2) + ' rpm';
    document.getElementById('cV').textContent = fmt(v, 1) + ' m/s';
    document.getElementById('cHead').textContent = fmt(1.8 / R * 100, R < 1000 ? 2 : 3) + ' %';
  }
  cRange.addEventListener('input', updCopper);

  // ---- Millar: 1 jam = 7 tahun ----
  const mRange = document.getElementById('mRange');
  function updMillar() {
    const q = +mRange.value / 4, h = Math.floor(q), mi = Math.round((q - h) * 60);   // langkah 15 menit
    document.getElementById('mH').textContent = ((h ? h + ' ' + T('hr') : '') + (mi ? ' ' + mi + ' ' + T('mn') : '')).trim();
    const y = q * 7;
    document.getElementById('mY').textContent = fmt(y, y < 10 ? 2 : 1) + ' ' + T('yr');
    document.getElementById('mD').textContent = fmt(y * 365.25, 0) + ' ' + T('dy');
  }
  mRange.addEventListener('input', updMillar);

  // ---- render teks (dipanggil ulang saat ganti bahasa) ----
  const langBox = document.getElementById('lang'), seen = new Set();
  function render() {
    const en = LANG === 'en';
    document.documentElement.lang = LANG;
    document.title = `${APP.name}: ${T('menu')}`;
    document.getElementById('tagline').textContent = tr(APP, 'tagline');
    const soon = document.getElementById('soon'); soon.textContent = '';
    for (const e of EXPERIENCES.filter((x) => !x.ready)) {
      const d = document.createElement('div');
      d.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13l9-2 3-6h2l-1 6 7 1v2l-7 1 1 6h-2l-3-6-9-2z"/></svg><div><b></b><br><span></span></div>';
      d.querySelector('b').textContent = `${tr(e, 'title')} (${T('soon')})`; d.querySelector('span').textContent = tr(e, 'desc');
      soon.appendChild(d);
    }
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T(el.dataset.t) ?? ''; });
    document.querySelectorAll('a.go').forEach((a) => { a.href = `experiences/${a.dataset.x}/index.html?lang=${LANG}`; });
    document.querySelectorAll('[data-s]').forEach((box) => {
      box.textContent = '';
      for (const st of STATS[box.dataset.s]) {
        const d = document.createElement('div'); d.className = 'stat'; d.innerHTML = '<b></b><span></span>';
        d.querySelector('b').textContent = statText(st, counted.has(box) ? 1 : 0); d.querySelector('span').textContent = T(st.k);
        box.appendChild(d);
      }
    });
    document.querySelectorAll('[data-f]').forEach((box) => {
      box.textContent = '';
      FEATS[box.dataset.f].forEach((f, i) => {
        const d = document.createElement('div'); d.className = 'feat rv' + (seen.has(box) ? ' in' : ''); d.style.setProperty('--d', (i * 0.08) + 's');
        d.innerHTML = `<div class="ic">${icon(f[0])}</div><div><b></b><span></span></div>`;
        d.querySelector('b').textContent = f[en ? 2 : 1]; d.querySelector('span').textContent = f[en ? 4 : 3];
        box.appendChild(d);
      });
    });
    document.querySelectorAll('[data-k]').forEach((box) => {
      box.textContent = '';
      for (const k of KEYS[box.dataset.k]) {
        const s = document.createElement('span'), kb = document.createElement('kbd'); kb.textContent = k[0];
        s.append(kb, k[en ? 2 : 1]); box.appendChild(s);
      }
    });
    for (const k in PH) {
      PH[k].el.querySelectorAll('.spot .lab').forEach((l, i) => { l.textContent = (en ? SPOTS[k].list[i].en : SPOTS[k].list[i].id)[0]; });
      selSpot(k, PH[k].sel);
    }
    updCopper(); updMillar();
    langBox.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.lang === LANG));
  }
  for (const [c, name] of LANGS) {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.lang = c; b.textContent = name;
    b.addEventListener('click', () => { LANG = c; try { localStorage.setItem('lazarus.lang', c); } catch (e) { /* abaikan */ } render(); });
    langBox.appendChild(b);
  }
  render();

  // ---- muncul saat digulir ----
  const io = new IntersectionObserver((es) => {
    for (const e of es) {
      if (!e.isIntersecting) continue;
      const t = e.target; t.classList.add('in'); io.unobserve(t);
      if (t.dataset.f !== undefined) { seen.add(t); t.querySelectorAll('.rv').forEach((x) => x.classList.add('in')); }
      const st = t.querySelector('[data-s]'); if (st) countUp(st);
    }
  }, { threshold: 0.2 });
  document.querySelectorAll('.rv, [data-f]').forEach((el) => io.observe(el));
  // penanda hanya berganti sendiri saat fotonya terlihat
  const io3 = new IntersectionObserver((es) => { for (const e of es) PH[e.target.dataset.p].vis = e.isIntersecting; }, { threshold: 0.5 });
  for (const k in PH) io3.observe(PH[k].el);

  // ---- latar hero ikut lingkaran yang disorot; kembali ke Copper saat lepas ----
  const heroBg = (id) => document.querySelectorAll('.hbg').forEach((d) => d.classList.toggle('on', d.dataset.bg === id));
  document.querySelectorAll('.route a').forEach((a) => {
    const id = a.getAttribute('href').slice(1);
    a.addEventListener('mouseenter', () => heroBg(id)); a.addEventListener('focus', () => heroBg(id));
    a.addEventListener('mouseleave', () => heroBg('cooper-station')); a.addEventListener('blur', () => heroBg('cooper-station'));
  });

  // ---- gulir ke bagian: cepat di awal lalu melambat sampai berhenti (easeOutQuart), bukan lompat ----
  let scrollAnim = 0;
  function glideTo(y) {
    const y0 = scrollY, dy = y - y0;
    // tetap halus walau sistem memakai 'kurangi gerak' (pemilik ingin efek ini; gulir dipicu klik sendiri)
    if (Math.abs(dy) < 2) { scrollTo(0, y); return; }
    const dur = Math.min(1600, 700 + Math.abs(dy) * 0.35), t0 = performance.now(), id = ++scrollAnim;
    const step = (t) => {
      if (id !== scrollAnim) return;                                   // klik baru membatalkan animasi lama
      const k = Math.min(1, (t - t0) / dur);
      scrollTo(0, y0 + dy * (1 - Math.pow(1 - k, 4)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  addEventListener('wheel', () => { scrollAnim++; }, { passive: true });  // pengguna menggulir sendiri = berhenti
  addEventListener('touchstart', () => { scrollAnim++; }, { passive: true });
  document.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener('click', (e) => {
    const el = document.querySelector(a.getAttribute('href')); if (!el) return;
    e.preventDefault();
    glideTo(Math.round(el.getBoundingClientRect().top + scrollY));
    history.replaceState(null, '', a.getAttribute('href'));
  }));

  // ---- titik navigasi ----
  const dots = [...document.querySelectorAll('.dots a')];
  const io2 = new IntersectionObserver((es) => {
    for (const e of es) if (e.isIntersecting) dots.forEach((d) => d.classList.toggle('on', d.getAttribute('href') === '#' + e.target.id));
  }, { threshold: 0.3 });
  ['top', 'cooper-station', 'gargantua', 'millar'].forEach((id) => io2.observe(document.getElementById(id)));

  // ---- paralaks latar ----
  const bgs = [...document.querySelectorAll('.xp .bg')];
  let pend = false;
  function para() {
    pend = false;
    for (const b of bgs) { const r = b.parentElement.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) continue; b.style.transform = `translateY(${(r.top * -0.1).toFixed(1)}px)`; }
  }
  if (!reduce) { addEventListener('scroll', () => { if (!pend) { pend = true; requestAnimationFrame(para); } }, { passive: true }); para(); }
</script>
</body>
</html>
