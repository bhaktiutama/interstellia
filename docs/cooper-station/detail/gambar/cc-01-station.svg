<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8ecf2"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9bd62"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fd3dc"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f3a55a"/></marker>
</defs>
<rect width="800" height="450" rx="14" fill="#0b0e14"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#e8ecf2">Copper Corn Station at a glance</text>
<text x="24" y="58" font-size="13" fill="#9aa2ae">An O'Neill cylinder: the city lives on the inside wall</text>
<circle cx="190" cy="250" r="140" fill="none" stroke="#d9bd62" stroke-width="6"/>
<circle cx="190" cy="250" r="5" fill="#fff8d8"/>
<text x="200.0" y="242.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">sunline (axis)</text>
<line x1="190" y1="250" x2="304.7" y2="169.7" stroke="#e8ecf2" stroke-dasharray="4 4"/>
<text x="210.0" y="180.0" font-size="13" fill="#e8ecf2" text-anchor="end" font-weight="400">R = 1,000 m</text>
<path d="M37.8 194.6 A162 162 0 0 1 134.6 97.8" fill="none" stroke="#e8ecf2" stroke-width="2" marker-end="url(#a)"/>
<text x="250.0" y="100.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">spin: 1 turn every 63.4 s (0.946 rpm)</text>
<line x1="190" y1="390" x2="112" y2="390" stroke="#8fd3dc" stroke-width="2.5" marker-end="url(#at)"/>
<text x="182.0" y="412.0" font-size="12" fill="#8fd3dc" text-anchor="middle" font-weight="400">floor speed 99.05 m/s</text>
<line x1="190.0" y1="387.0" x2="190.0" y2="373.0" stroke="#e8ecf2" stroke-width="2"/><circle cx="190.0" cy="369.0" r="4.0" fill="#e8ecf2"/>
<line x1="71.4" y1="181.5" x2="83.5" y2="188.5" stroke="#e8ecf2" stroke-width="2"/><circle cx="86.9" cy="190.5" r="4.0" fill="#e8ecf2"/>
<line x1="308.6" y1="181.5" x2="296.5" y2="188.5" stroke="#e8ecf2" stroke-width="2"/><circle cx="293.1" cy="190.5" r="4.0" fill="#e8ecf2"/>
<text x="190.0" y="432.0" font-size="12" fill="#9aa2ae" text-anchor="middle" font-weight="400">Cross-section: heads point to the axis</text>
<rect x="390" y="205" width="380.0" height="95.0" fill="none" stroke="#d9bd62" stroke-width="3"/>
<line x1="390" y1="252.5" x2="770.0" y2="252.5" stroke="#fff8d8" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="390" y1="191" x2="770.0" y2="191" stroke="#e8ecf2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="580.0" y="183.0" font-size="13" fill="#e8ecf2" text-anchor="middle" font-weight="400">L = 8,000 m</text>
<text x="390.0" y="322.0" font-size="12" fill="#e8ecf2" text-anchor="start" font-weight="400">End cap A</text>
<text x="390.0" y="338.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">lift, hub, despun dock</text>
<text x="770.0" y="322.0" font-size="12" fill="#e8ecf2" text-anchor="end" font-weight="400">End cap B</text>
<text x="770.0" y="338.0" font-size="12" fill="#9aa2ae" text-anchor="end" font-weight="400">sunlight enters at 25 deg</text>
<line x1="794.0" y1="193.8" x2="566.3" y2="300.0" stroke="#f3a55a" stroke-width="2" marker-end="url(#ao)"/>
<line x1="566.3" y1="350.0" x2="770.0" y2="350.0" stroke="#f3a55a" marker-start="url(#ao)" marker-end="url(#ao)"/>
<text x="668.1" y="368.0" font-size="12" fill="#f3a55a" text-anchor="middle" font-weight="400">sunlit reach about 4.3 km</text>
<text x="580.0" y="400.0" font-size="12" fill="#9aa2ae" text-anchor="middle" font-weight="400">Side view (to scale)</text>
<text x="390.0" y="432.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">Orbit: 260,000 km from Saturn, one orbit every 37.57 h</text>
</svg>
