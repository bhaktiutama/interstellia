<text x="610.0" y="320.0" font-size="12" fill="#9aa2ae" text-anchor="middle" font-weight="400">s = θR across, h = R - r up</text>
<text x="610.0" y="336.0" font-size="12" fill="#9aa2ae" text-anchor="middle" font-weight="400">the box hugs the floor everywhere</text>
<text x="24.0" y="410.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">Depth and receivers both use (θ, r) -> (s, h), so shadows line up on the curved wall.</text>
