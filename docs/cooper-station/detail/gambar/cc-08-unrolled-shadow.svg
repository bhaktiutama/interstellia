<line x1="190.0" y1="290.0" x2="190.0" y2="260.0" stroke="#7f8896" stroke-width="10"/>
<line x1="258.8" y1="268.3" x2="241.6" y2="243.7" stroke="#7f8896" stroke-width="10"/>
<line x1="302.8" y1="211.0" x2="274.6" y2="200.8" stroke="#7f8896" stroke-width="10"/>
