<text x="190.0" y="335.0" font-size="12" fill="#9aa2ae" text-anchor="middle" font-weight="400">flat shadow box vs curved floor:</text>
<text x="190.0" y="351.0" font-size="12" fill="#9aa2ae" text-anchor="middle" font-weight="400">wasted texels, walls cut off</text>
