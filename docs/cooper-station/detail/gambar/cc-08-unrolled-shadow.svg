<rect width="800" height="430" rx="14" fill="#0b0e14"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#e8ecf2">Behind the scenes: unrolling the cylinder for shadows</text>
<text x="24" y="58" font-size="13" fill="#9aa2ae">Shadow maps rendered in unrolled coordinates (stage 18b-3)</text>
