<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8ecf2"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9bd62"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fd3dc"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f3a55a"/></marker>
</defs>
<rect width="800" height="345" rx="14" fill="#0b0e14"/>
<text x="24" y="36" font-size="18" font-weight="600" fill="#e8ecf2">Behind the scenes: two scenes, two scales</text>
<text x="24" y="58" font-size="13" fill="#9aa2ae">Precision trick for a planet and a pebble in one frame</text>
<rect x="60" y="100" width="300" height="160" rx="10" fill="none" stroke="#f3a55a" stroke-width="2"/>
<text x="80.0" y="128.0" font-size="15" fill="#f3a55a" text-anchor="start" font-weight="600">1. farScene</text>
<text x="80.0" y="150.0" font-size="13" fill="#e8ecf2" text-anchor="start" font-weight="400">1 unit = 1,000 km</text>
<text x="80.0" y="182.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">Saturn 60,268 km radius</text>
<text x="80.0" y="204.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">orbit 260,000 km</text>
<text x="80.0" y="226.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">stars, the Sun</text>
<text x="80.0" y="248.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">drawn first, then depth cleared</text>
<rect x="440" y="100" width="300" height="160" rx="10" fill="none" stroke="#d9bd62" stroke-width="2"/>
<text x="460.0" y="128.0" font-size="15" fill="#d9bd62" text-anchor="start" font-weight="600">2. main scene</text>
<text x="460.0" y="150.0" font-size="13" fill="#e8ecf2" text-anchor="start" font-weight="400">1 unit = 1 m</text>
<text x="460.0" y="182.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">station 8,000 m x 2,000 m</text>
<text x="460.0" y="204.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">city, trees, people, cars</text>
<text x="460.0" y="226.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">drawn on top with its own</text>
<text x="460.0" y="248.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">near and far planes</text>
<line x1="360" y1="180" x2="440" y2="180" stroke="#e8ecf2" stroke-width="2" marker-end="url(#a)"/>
<text x="24.0" y="300.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">Why: one scene in metres would put Saturn at 2.6e8 units, where a 32-bit float</text>
<text x="24.0" y="318.0" font-size="12" fill="#9aa2ae" text-anchor="start" font-weight="400">can only step in 16 m, and one depth buffer cannot cover 0.1 m to 3e8 m.</text>
</svg>
