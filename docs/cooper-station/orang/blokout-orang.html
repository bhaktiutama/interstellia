<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blokout orang 28b</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9bec2; font: 13px/1.4 system-ui, sans-serif; color: #222; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #info { position: fixed; left: 10px; top: 8px; right: 10px; background: rgba(255,255,255,0.78); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
  #bar { position: fixed; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #bar button, #bar label { background: rgba(255,255,255,0.88); border: 1px solid #8a9096; border-radius: 8px; padding: 8px 12px; font: inherit; color: #222; cursor: pointer; }
  #bar button.on { background: #2f5f9e; color: #fff; border-color: #2f5f9e; }
  #bar input[type=range] { vertical-align: middle; width: 120px; }
  .lab { position: fixed; transform: translate(-50%, 0); background: rgba(255,255,255,0.8); padding: 2px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; pointer-events: none; text-align: center; }
</style>
</head>
<body>
<div id="info"></div>
<div id="bar"></div>
<script src="../../../shared/orang.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
</script>
<script type="module">
/* Blokout orang (rencana tahap 28b, docs/cooper-station/rencana-tahap-28-cooper-station.md): model kotak lama dan tiga tingkat detail
   baru (L0 dekat, L1 menengah, L2 jauh) berjajar, pose yang sama. Bentuk dari shared/orang.js (PEDKIT), kulit dua tulang di CPU
   (kembaran vertex shader yang dipasang di game pada tahap 28c). Desain orisinal, prosedural. Seret = putar, roda = zoom. */
import * as THREE from 'three';
const K = window.PEDKIT;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb9bec2);
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xe6eeff, 0x7a756a, 1.15));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.3); sun.position.set(2.5, 4, 3.5); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x8c8f8a })); scene.add(floor);

// ---------- orang: palet, warna per id ----------
const H = (h) => { const c = new THREE.Color(h); return [c.r, c.g, c.b]; };
const state = { shirt: 1, pants: 0, skin: 1, hair: 1, shortSleeve: true, longHair: false, bag: false, pose: 'jalan', phase: 0, play: true, wire: false };
function idColor(id) {
  const P = K.PAL;
  switch (id) {
    case 0: return H(P.shirt[state.shirt]);
    case 1: return H(P.skin[state.skin]);
    case 2: case 8: return H(P.hair[state.hair]);
    case 3: return H(P.pants[state.pants]);
    case 4: return [0.045, 0.04, 0.04];
    case 5: return [0.42, 0.41, 0.38];
    case 6: return [0.16, 0.10, 0.06];
    case 7: return state.shortSleeve ? H(P.skin[state.skin]) : H(P.shirt[state.shirt]);
    default: return [1, 0, 1];
  }
}

const LAB = ['Lama (17 kotak)', 'L0 dekat', 'L1 menengah', 'L2 jauh'], XS = [-1.5, -0.5, 0.5, 1.5];
const models = [];   // { mesh, g (PEDKIT) | null, rest, posed }

function buildOld() {
  const parts = K.old.parts(), pos = [], nrm = [], ids = [], idx = [];
  for (const [sx, sy, sz, x, y, z, id] of parts) {
    const g = new THREE.BoxGeometry(sx, sy, sz).translate(x, y, z), v0 = pos.length / 3;
    pos.push(...g.attributes.position.array); nrm.push(...g.attributes.normal.array);
    for (let i = 0; i < g.attributes.position.count; i++) ids.push(id);
    for (const q of g.index.array) idx.push(v0 + q);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos.slice(), 3)); geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(pos.length), 3)); geo.setIndex(idx);
  return { geo, rest: Float32Array.from(pos), ids, old: true, tris: idx.length / 3, titik: ids.length, hard: null };
}
function buildNew(level) {
  const g = K.shape(level), geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(g.position), 3)); geo.setAttribute('normal', new THREE.Float32BufferAttribute(new Float32Array(g.normal), 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(g.position.length), 3)); geo.setIndex(new THREE.BufferAttribute(g.index.slice(), 1));
  return { geo, g, old: false, tris: g.tris, titik: g.titik, hard: K.edgeStats(g.position, g.index, 50, g.capMask) };
}
const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
const matW = new THREE.MeshBasicMaterial({ color: 0x15202b, wireframe: true });
[buildOld(), buildNew(0), buildNew(1), buildNew(2)].forEach((m, i) => {
  m.mesh = new THREE.Mesh(m.geo, mat); m.mesh.position.x = XS[i]; m.mesh.frustumCulled = false; scene.add(m.mesh);
  m.wire = new THREE.Mesh(m.geo, matW); m.wire.position.x = XS[i]; m.wire.frustumCulled = false; m.wire.visible = false; scene.add(m.wire);
  const d = document.createElement('div'); d.className = 'lab'; document.body.appendChild(d); m.lab = d; models.push(m);
});
// indeks kotak model lama (sama dengan tools/uji_orang_bentuk.cjs): 12 tepi keras dari 18 per kotak
models[0].hard = { persen: 66.7 };

function recolor() {
  for (const m of models) {
    const c = m.geo.attributes.color.array, n = m.titik;
    for (let i = 0; i < n; i++) {
      let id = m.old ? ({ 0: 0, 1: 1, 2: 2, 3: 3, 4: 3, 5: 3, 6: 3, 7: 0, 8: 0, 9: 6, 10: 3, 11: 1, 12: 1, 13: 1 })[m.ids[i]] : m.g.part[i];
      if (m.old && (m.ids[i] === 5 || m.ids[i] === 6) && m.rest[3 * i + 1] < 0.09) id = 4;   // sepatu lama: warna gelap bila titik di bawah 0,09 m
      const col = idColor(id), ao = m.old ? 1 : m.g.ao[i];
      c[3 * i] = col[0] * ao; c[3 * i + 1] = col[1] * ao; c[3 * i + 2] = col[2] * ao;
    }
    m.geo.attributes.color.needsUpdate = true;
    if (!m.old) {   // rambut panjang dan tas hanya bila dipilih
      const keep = []; const ix = m.g.index;
      for (let t = 0; t < ix.length; t += 3) { const a = m.g.part[ix[t]], b = m.g.part[ix[t + 1]], d = m.g.part[ix[t + 2]]; if (((a === 8 || b === 8 || d === 8) && !state.longHair) || ((a === 6 || b === 6 || d === 6) && !state.bag)) continue; keep.push(ix[t], ix[t + 1], ix[t + 2]); }
      m.geo.setIndex(keep);
    }
  }
}
const OLDBAG = 9;
function poseAll() {
  const A = K.poseOf(state.pose, state.phase);
  for (const m of models) {
    const p = m.geo.attributes.position.array;
    if (m.old) {
      for (let i = 0; i < m.titik; i++) { const o = K.old.point(m.ids[i], [m.rest[3 * i], m.rest[3 * i + 1], m.rest[3 * i + 2]], state.phase, state.pose); p[3 * i] = o[0]; p[3 * i + 1] = o[1]; p[3 * i + 2] = o[2]; if (m.ids[i] === OLDBAG && !state.bag) { p[3 * i + 1] = -10; } }
      m.geo.attributes.position.needsUpdate = true; m.geo.computeVertexNormals();
    } else {
      K.pose(m.g, A, p, m.geo.attributes.normal.array);
      m.geo.attributes.position.needsUpdate = true; m.geo.attributes.normal.needsUpdate = true;
    }
  }
}

// ---------- kamera ----------
const cam = { az: 0.35, el: 0.12, dist: 7.2, ty: 0.9, tx: 0 };
const VIEWS = { 'Depan': { az: 0, el: 0.08, dist: 7.2, ty: 0.9, tx: 0 }, 'Samping': { az: Math.PI / 2, el: 0.08, dist: 7.2, ty: 0.9, tx: 0 }, 'Belakang': { az: Math.PI, el: 0.1, dist: 7.2, ty: 0.9, tx: 0 }, 'Atas': { az: 0.2, el: 1.2, dist: 7.5, ty: 0.7, tx: 0 },
  'Dekat L0': { az: 0.45, el: 0.12, dist: 3.1, ty: 1.05, tx: -0.5 }, 'Wajah': { az: 0.5, el: 0.08, dist: 1.1, ty: 1.6, tx: -0.5 }, 'Tangan': { az: 0.7, el: 0.1, dist: 1.0, ty: 0.85, tx: -0.2 }, 'Kaki': { az: 0.9, el: 0.1, dist: 1.4, ty: 0.3, tx: -0.5 } };
function applyCam() {
  const c = cam, ce = Math.cos(c.el), tgt = new THREE.Vector3(c.tx, c.ty, 0);
  camera.position.set(tgt.x + Math.sin(c.az) * ce * c.dist, tgt.y + Math.sin(c.el) * c.dist, tgt.z + Math.cos(c.az) * ce * c.dist); camera.lookAt(tgt);
}
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', (e) => { if (!drag) return; cam.az -= (e.clientX - drag.x) * 0.008; cam.el = Math.max(-0.2, Math.min(1.45, cam.el + (e.clientY - drag.y) * 0.006)); drag = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', () => { drag = null; });
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.max(0.6, Math.min(14, cam.dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });

// ---------- kontrol ----------
const bar = document.getElementById('bar'), info = document.getElementById('info'), btns = {};
const btn = (txt, fn, key) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = () => { fn(); sync(); }; bar.appendChild(b); if (key) btns[key] = b; return b; };
for (const v of Object.keys(VIEWS)) btn(v, () => Object.assign(cam, VIEWS[v]));
btn('Jalan', () => { state.pose = 'jalan'; }, 'jalan'); btn('Berdiri', () => { state.pose = 'berdiri'; }, 'berdiri'); btn('Duduk', () => { state.pose = 'duduk'; }, 'duduk');
btn('Putar/jeda', () => { state.play = !state.play; }, 'play');
btn('Kerangka', () => { state.wire = !state.wire; for (const m of models) m.wire.visible = state.wire; }, 'wire');
btn('Lengan panjang', () => { state.shortSleeve = !state.shortSleeve; recolor(); }, 'sleeve');
btn('Rambut panjang', () => { state.longHair = !state.longHair; recolor(); }, 'hairl');
btn('Tas', () => { state.bag = !state.bag; recolor(); }, 'bag');
btn('Acak orang', () => { const r = (n) => Math.floor(Math.random() * n); state.shirt = r(14); state.pants = r(8); state.skin = r(6); state.hair = r(6); recolor(); });
const lbl = document.createElement('label'); lbl.innerHTML = 'Fase <input id="ph" type="range" min="0" max="6.283" step="0.01" value="0">'; bar.appendChild(lbl);
document.getElementById('ph').oninput = (e) => { state.phase = +e.target.value; state.play = false; sync(); };
function sync() {
  for (const k of ['jalan', 'berdiri', 'duduk']) btns[k].classList.toggle('on', state.pose === k);
  btns.play.classList.toggle('on', state.play); btns.wire.classList.toggle('on', state.wire); btns.sleeve.classList.toggle('on', !state.shortSleeve); btns.hairl.classList.toggle('on', state.longHair); btns.bag.classList.toggle('on', state.bag);
}
info.innerHTML = 'Blokout orang, tahap 28b (desain orisinal, prosedural). Dari kiri: model kotak lama, lalu tiga tingkat detail baru. ' + models.map((m, i) => `<b>${LAB[i]}</b> ${m.tris} segitiga`).join(' | ') + ' | indeks kotak (tepi keras &gt; 50 derajat) ' + models.map((m) => m.hard.persen.toFixed(0) + '%').join(' / ');

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (state.play) { state.phase = (state.phase + dt * 5.2) % 6.283; document.getElementById('ph').value = state.phase; }
  poseAll(); applyCam(); renderer.render(scene, camera);
  models.forEach((m, i) => { const v = new THREE.Vector3(XS[i], -0.02, 0).project(camera); m.lab.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; m.lab.style.top = ((1 - v.y) / 2 * innerHeight + 4) + 'px'; m.lab.innerHTML = `<b>${LAB[i]}</b><br>${m.tris} segitiga`; });
  requestAnimationFrame(frame);
}
recolor(); sync(); requestAnimationFrame(frame);
window.__blokout = { state, cam, VIEWS, models, recolor, poseAll, ready: true };
</script>
</body>
</html>
